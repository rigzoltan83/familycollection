<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FamilyCollection – Adminisztráció</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: #eee;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .container {
            width: min(1200px, 94vw);
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1,
        h2 {
            margin-top: 0;
            color: #6dff6d;
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button,
        .button-link {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #555;
            color: white;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        .button-link:hover {
            background: #666;
        }

        button.primary {
            background: #2e8b57;
        }

        button.primary:hover {
            background: #349d63;
        }

        button.danger {
            background: #8b2e2e;
        }

        button:disabled {
            opacity: 0.55;
            cursor: default;
        }

        .panel {
            margin-bottom: 22px;
            padding: 18px;
            border-radius: 12px;
            background: #202020;
        }

        .context-line {
            color: #bbb;
        }

        .status {
            min-height: 24px;
            margin-top: 10px;
        }

        .status.error {
            color: #ff7b7b;
        }

        .status.success {
            color: #6dff6d;
        }

        .users-list {
            display: grid;
            gap: 14px;
        }

        .user-card {
            padding: 16px;
            border-radius: 10px;
            background: #292929;
        }

        .user-card.inactive {
            opacity: 0.65;
        }

        .user-header {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .user-name {
            font-size: 19px;
            font-weight: bold;
            color: #6dff6d;
        }

        .user-email {
            margin-top: 4px;
            color: #aaa;
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #444;
            color: #ddd;
            font-size: 12px;
            white-space: nowrap;
        }

        .user-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #bbb;
            font-size: 13px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 7px;
            background: #111;
            color: #fff;
            font-size: 15px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 40px;
        }

        .checkbox-row input {
            width: auto;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .new-user-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );
            gap: 12px;
        }

        .muted {
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 650px) {
            .topbar {
                flex-direction: column;
            }

            .user-header {
                flex-direction: column;
            }
        }

        .panel-description {
            margin-top: -4px;
            margin-bottom: 24px;
            color: #64748b;
            line-height: 1.5;
        }

        .category-form-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );
            gap: 16px;
            margin-bottom: 16px;
        }

        .category-form-grid input,
        .category-form-grid select,
        textarea {
            width: 100%;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        .checkbox-field {
            display: flex;
            align-items: end;
            padding-bottom: 10px;
        }

        .checkbox-field label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-field input {
            width: auto;
        }

        .categories-list {
            display: grid;
            gap: 14px;
            margin-bottom: 30px;
        }

        .category-card {
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            padding: 16px;
            background: #fff;
        }

        .category-card.system-category {
            background: #f8fafc;
        }

        .category-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .category-card-title {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 999px;
            background: #e2e8f0;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .category-edit-grid {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(160px, 1fr)
                );
            gap: 12px;
        }

        .category-description {
            margin: 8px 0;
            color: #475569;
        }

        .category-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .category-card .actions {
            margin-top: 14px;
        }    

</style>
</head>

const newUsername =

        function escapeHtml(value) {
            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }


        function roleLabel(role) {
            const labels = {
                owner: "Tulajdonos",
                admin: "Adminisztrátor",
                editor: "Szerkesztő",
                viewer: "Megtekintő"
            };

            return labels[role] || role;
        }


function setStatus(
    element,
    message,
    type = ""
) {
    if (!element) {
        return;
    }

    element.textContent = message;

    element.classList.remove(
        "success",
        "error"
    );

    if (type) {
        element.classList.add(type);
    }
}

function renderSystemCategories(categories) {
    systemCategoriesList.innerHTML = "";

    if (!categories.length) {
        systemCategoriesList.innerHTML =
            '<div class="muted">'
            + 'Nincs rendszerkategória.'
            + '</div>';

        return;
    }

    for (const category of categories) {
        const card =
            document.createElement(
                "div"
            );

        card.className =
            "category-card system-category";

        card.innerHTML = `
            <div class="category-card-header">
                <div class="category-card-title">
                    ${escapeHtml(category.name)}
                </div>

                <span class="category-badge">
                    Rendszer
                </span>
            </div>

            <div class="category-description">
                ${escapeHtml(
                    category.description
                    || "Nincs leírás."
                )}
            </div>

            <div class="category-meta">
                <span>
                    Slug:
                    ${escapeHtml(category.slug)}
                </span>

                <span>
                    Ikon:
                    ${escapeHtml(
                        category.icon || "-"
                    )}
                </span>

                <span>
                    Vonalkód:
                    ${
                        category.supports_barcode
                            ? "igen"
                            : "nem"
                    }
                </span>

                <span>
                    Metaadat:
                    ${escapeHtml(
                        category.metadata_lookup_type
                    )}
                </span>

                <span>
                    Állapot:
                    ${
                        category.is_active
                            ? "aktív"
                            : "inaktív"
                    }
                </span>
            </div>
        `;

        systemCategoriesList.appendChild(
            card
        );
    }
}

async function createCategoryField(
    category,
    card
) {
    const name =
        card
            .querySelector(
                ".new-field-name"
            )
            .value
            .trim();

    const fieldKey =
        card
            .querySelector(
                ".new-field-key"
            )
            .value
            .trim();

    const fieldType =
        card
            .querySelector(
                ".new-field-type"
            )
            .value;

    const sortOrder =
        Number(
            card
                .querySelector(
                    ".new-field-sort-order"
                )
                .value
        );

    const statusBox =
        card.querySelector(
            ".create-field-status"
        );

    const button =
        card.querySelector(
            ".create-field"
        );

    if (!name) {
        setStatus(
            statusBox,
            "❌ A mező neve kötelező.",
            "error"
        );

        return;
    }

    if (!fieldKey) {
        setStatus(
            statusBox,
            "❌ A mezőkulcs kötelező.",
            "error"
        );

        return;
    }

    if (
        !Number.isInteger(sortOrder)
        || sortOrder < 0
    ) {
        setStatus(
            statusBox,
            (
                "❌ A sorrend nem lehet "
                + "negatív egész szám."
            ),
            "error"
        );

        return;
    }

    button.disabled = true;

    setStatus(
        statusBox,
        "Létrehozás..."
    );

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories/${
                category.id
            }/fields`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name,
                    field_key:
                        fieldKey,
                    field_type:
                        fieldType,
                    is_required:
                        card
                            .querySelector(
                                ".new-field-required"
                            )
                            .checked,
                    is_searchable:
                        card
                            .querySelector(
                                ".new-field-searchable"
                            )
                            .checked,
                    is_filterable:
                        card
                            .querySelector(
                                ".new-field-filterable"
                            )
                            .checked,
                    is_visible_in_list:
                        card
                            .querySelector(
                                ".new-field-visible-list"
                            )
                            .checked,
                    sort_order:
                        sortOrder,
                    validation_rules: {},
                    default_value: {}
                })
            }
        );

        card
            .querySelector(
                ".new-field-name"
            )
            .value = "";

        card
            .querySelector(
                ".new-field-key"
            )
            .value = "";

        card
            .querySelector(
                ".new-field-sort-order"
            )
            .value = "100";

        card
            .querySelector(
                ".new-field-required"
            )
            .checked = false;

        card
            .querySelector(
                ".new-field-searchable"
            )
            .checked = false;

        card
            .querySelector(
                ".new-field-filterable"
            )
            .checked = false;

        card
            .querySelector(
                ".new-field-visible-list"
            )
            .checked = false;

        setStatus(
            statusBox,
            "✅ Mező létrehozva.",
            "success"
        );

        await loadCategoryFields(
            category,
            card
        );

    } catch (error) {
        setStatus(
            statusBox,
            `❌ ${error.message}`,
            "error"
        );

    } finally {
        button.disabled = false;
    }
}

async function saveCategoryField(
    category,
    field,
    card,
    row
) {
    const statusBox =
        row.querySelector(
            ".field-row-status"
        );

    const button =
        row.querySelector(
            ".save-field"
        );

    const name =
        row
            .querySelector(
                ".field-name"
            )
            .value
            .trim();

    const sortOrder =
        Number(
            row
                .querySelector(
                    ".field-sort-order"
                )
                .value
        );

    if (!name) {
        setStatus(
            statusBox,
            "❌ A mező neve kötelező.",
            "error"
        );

        return;
    }

    if (
        !Number.isInteger(sortOrder)
        || sortOrder < 0
    ) {
        setStatus(
            statusBox,
            (
                "❌ A sorrend nem lehet "
                + "negatív egész szám."
            ),
            "error"
        );

        return;
    }

    button.disabled = true;

    setStatus(
        statusBox,
        "Mentés..."
    );

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories/${
                category.id
            }/fields/${
                field.id
            }`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name,
                    sort_order:
                        sortOrder,

                    is_required:
                        row
                            .querySelector(
                                ".field-required"
                            )
                            .checked,

                    is_searchable:
                        row
                            .querySelector(
                                ".field-searchable"
                            )
                            .checked,

                    is_filterable:
                        row
                            .querySelector(
                                ".field-filterable"
                            )
                            .checked,

                    is_visible_in_list:
                        row
                            .querySelector(
                                ".field-visible-list"
                            )
                            .checked,

                    is_active:
                        row
                            .querySelector(
                                ".field-active"
                            )
                            .checked
                })
            }
        );

        setStatus(
            statusBox,
            "✅ Mező mentve.",
            "success"
        );

    } catch (error) {
        setStatus(
            statusBox,
            `❌ ${error.message}`,
            "error"
        );

    } finally {
        button.disabled = false;
    }
}

async function deactivateCategoryField(
    category,
    field,
    card,
    row
) {
    const statusBox =
        row.querySelector(
            ".field-row-status"
        );

    const confirmed =
        window.confirm(
            (
                `Biztosan inaktiválod ezt a mezőt?\n\n`
                + `${field.name} (${field.field_key})`
            )
        );

    if (!confirmed) {
        return;
    }

    setStatus(
        statusBox,
        "Inaktiválás..."
    );

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories/${
                category.id
            }/fields/${
                field.id
            }`,
            {
                method: "DELETE"
            }
        );

        await loadCategoryFields(
            category,
            card
        );

    } catch (error) {
        setStatus(
            statusBox,
            `❌ ${error.message}`,
            "error"
        );
    }
}

function isSelectCategoryField(field) {
    return (
        field.field_type === "single_select"
        || field.field_type === "multi_select"
    );
}

            ),

        );

    setStatus(
        statusBox,

    );

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories/${
                category.id
            }/fields/${
                field.id
            }/options`,
            {
                method: "POST",

                headers: {
                    "Content-Type":

                },

                body: JSON.stringify({

                    sort_order: sortOrder
                })
            }
        );

        valueInput.value = "";
        labelInput.value = "";
        sortOrderInput.value = "100";

        );

async function saveCategoryFieldOption(
    category,
    field,
    option,
    row,
    optionRow
) {
    const statusBox =
        optionRow.querySelector(
            ".option-row-status"
        );

    const button =
        optionRow.querySelector(
            ".save-option"
        );

    const label =
        optionRow
            .querySelector(
                ".option-label"
            )
            .value
            .trim();

    const sortOrder =
        Number(
            optionRow
                .querySelector(
                    ".option-sort-order"
                )
                .value
        );

    if (!label) {
        setStatus(
            statusBox,
            "❌ A megjelenő név kötelező.",
            "error"
        );

        return;
    }

    if (
        !Number.isInteger(sortOrder)
        || sortOrder < 0
    ) {
        setStatus(
            statusBox,
            (
                "❌ A sorrend nem lehet "
                + "negatív egész szám."
            ),
            "error"
        );

        return;
    }

    button.disabled = true;

    setStatus(
        statusBox,
        "Mentés..."
    );

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories/${
                category.id
            }/fields/${
                field.id
            }/options/${
                option.id
            }`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    label,
                    sort_order: sortOrder,
                    is_active:
                        optionRow
                            .querySelector(
                                ".option-active"
                            )
                            .checked
                })
            }
        );

        setStatus(
            statusBox,
            "✅ Opció mentve.",
            "success"
        );

    } catch (error) {
        setStatus(
            statusBox,
            `❌ ${error.message}`,
            "error"
        );

    } finally {
        button.disabled = false;
    }
}


async function deactivateCategoryFieldOption(
    category,
    field,
    option,
    row
) {
    const confirmed =
        window.confirm(
            (
                "Biztosan inaktiválod ezt "
                + "a választható értéket?\n\n"
                + `${option.label} (${option.value})`
            )
        );

    if (!confirmed) {
        return;
    }

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories/${
                category.id
            }/fields/${
                field.id
            }/options/${
                option.id
            }`,
            {
                method: "DELETE"
            }
        );

        await loadCategoryFieldOptions(
            category,
            field,
            row
        );

    } catch (error) {
        const statusBox =
            row.querySelector(
                ".field-options-status"
            );

        setStatus(
            statusBox,
            `❌ ${error.message}`,
            "error"
        );
    }
}

async function loadCategories() {
    setStatus(
        systemCategoriesStatus,
        "Betöltés..."
    );

    setStatus(
        householdCategoriesStatus,
        "Betöltés..."
    );

    try {
        const categories =
            await apiFetch(
                `/admin/households/${
                    activeHousehold.id
                }/categories`
            );

        const systemCategories =
            categories.filter(
                category =>
                    category.is_system
            );

        const householdCategories =
            categories.filter(
                category =>
                    !category.is_system
            );

        renderSystemCategories(
            systemCategories
        );

        renderHouseholdCategories(
            householdCategories
        );

        systemCategoriesStatus.style.display =
            "none";

        householdCategoriesStatus.style.display =
            "none";

    } catch (error) {
        setStatus(
            systemCategoriesStatus,
            `❌ ${error.message}`,
            "error"
        );

        setStatus(
            householdCategoriesStatus,
            `❌ ${error.message}`,
            "error"
        );
    }
}

async function createCategory() {
    const name =
        newCategoryName.value.trim();

    if (!name) {
        setStatus(
            createCategoryStatus,
            "❌ A név megadása kötelező.",
            "error"
        );

        return;
    }

    const sortOrder =
        Number(
            newCategorySortOrder.value
        );

    if (
        !Number.isInteger(sortOrder)
        || sortOrder < 0
    ) {
        setStatus(
            createCategoryStatus,
            (
                "❌ A sorrend nem lehet "
                + "negatív egész szám."
            ),
            "error"
        );

        return;
    }

    createCategoryButton.disabled =
        true;

    setStatus(
        createCategoryStatus,
        "Létrehozás..."
    );

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    name,
                    description:
                        newCategoryDescription
                            .value
                            .trim()
                        || null,
                    icon:
                        newCategoryIcon
                            .value
                            .trim()
                        || null,
                    supports_barcode:
                        newCategorySupportsBarcode
                            .checked,
                    sort_order:
                        sortOrder
                })
            }
        );

        newCategoryName.value = "";
        newCategoryIcon.value = "";
        newCategoryDescription.value = "";
        newCategorySortOrder.value = "100";
        newCategorySupportsBarcode.checked =
            false;

        setStatus(
            createCategoryStatus,
            "✅ Gyűjtemény létrehozva.",
            "success"
        );

        await loadCategories();

    } catch (error) {
        setStatus(
            createCategoryStatus,
            `❌ ${error.message}`,
            "error"
        );

    } finally {
        createCategoryButton.disabled =
            false;
    }
}

async function saveCategory(
    originalCategory,
    card
) {
    const name =
        card
            .querySelector(
                ".category-name"
            )
            .value
            .trim();

    const icon =
        card
            .querySelector(
                ".category-icon"
            )
            .value
            .trim();

    const description =
        card
            .querySelector(
                ".category-description-input"
            )
            .value
            .trim();

    const sortOrder =
        Number(
            card
                .querySelector(
                    ".category-sort-order"
                )
                .value
        );

    const supportsBarcode =
        card
            .querySelector(
                ".category-barcode"
            )
            .checked;

    const isActive =
        card
            .querySelector(
                ".category-active"
            )
            .checked;

    const rowStatus =
        card.querySelector(
            ".category-row-status"
        );

    const saveButton =
        card.querySelector(
            ".save-category"
        );

    if (!name) {
        setStatus(
            rowStatus,
            "❌ A név nem lehet üres.",
            "error"
        );

        return;
    }

    if (
        !Number.isInteger(sortOrder)
        || sortOrder < 0
    ) {
        setStatus(
            rowStatus,
            (
                "❌ A sorrend nem lehet "
                + "negatív egész szám."
            ),
            "error"
        );

        return;
    }

    const payload = {};

    if (name !== originalCategory.name) {
        payload.name = name;
    }

    if (
        (icon || null)
        !== originalCategory.icon
    ) {
        payload.icon =
            icon || null;
    }

    if (
        (description || null)
        !== originalCategory.description
    ) {
        payload.description =
            description || null;
    }

    if (
        sortOrder
        !== originalCategory.sort_order
    ) {
        payload.sort_order =
            sortOrder;
    }

    if (
        supportsBarcode
        !== originalCategory
            .supports_barcode
    ) {
        payload.supports_barcode =
            supportsBarcode;
    }

    if (
        isActive
        !== originalCategory.is_active
    ) {
        payload.is_active =
            isActive;
    }

    if (
        Object.keys(payload).length
        === 0
    ) {
        setStatus(
            rowStatus,
            "Nincs módosítás."
        );

        return;
    }

    saveButton.disabled = true;

    setStatus(
        rowStatus,
        "Mentés..."
    );

    try {
        await apiFetch(
            `/admin/households/${
                activeHousehold.id
            }/categories/${
                originalCategory.id
            }`,
            {
                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );

        setStatus(
            rowStatus,
            "✅ Mentve.",
            "success"
        );

        await loadCategories();

    } catch (error) {
        setStatus(
            rowStatus,
            `❌ ${error.message}`,
            "error"
        );

    } finally {
        saveButton.disabled = false;
    }
}

        async function apiFetch(
            url,
            options = {}
        ) {
            const response =
                await fetch(
                    url,
                    options
                );

            if (response.status === 401) {
                window.location.href =
                    "/ui/login.html";

                throw new Error(
                    "Nincs bejelentkezve."
                );
            }

            let data = null;

            try {
                data = await response.json();
            } catch {
                data = null;
            }

            if (!response.ok) {
                throw new Error(
                    data?.detail
                    || `HTTP ${response.status}`
                );
            }

            return data;
        }


        async function loadContext() {
            const context =
                await apiFetch(
                    "/auth/context"
                );

            currentUserId =
                context.user.id;

            const storedHouseholdId =
                Number(
                    localStorage.getItem(
                        "activeHouseholdId"
                    )
                );

            activeHousehold =
                context.households.find(
                    household =>
                        household.id
                        === storedHouseholdId
                )
                || context.households[0]
                || null;

            if (!activeHousehold) {
                throw new Error(
                    "Nincs aktív háztartási tagság."
                );
            }

            if (
                activeHousehold.role !== "admin"
                && activeHousehold.role !== "owner"
            ) {
                window.location.href =
                    "/ui/dashboard.html";

                throw new Error(
                    "Nincs admin jogosultság."
                );
            }

            localStorage.setItem(
                "activeHouseholdId",
                String(
                    activeHousehold.id
                )
            );

            contextLine.textContent =
                `${activeHousehold.name} – `
                + roleLabel(
                    activeHousehold.role
                );
        }


        function renderUsers(users) {
            usersList.innerHTML = "";

            if (!users.length) {
                usersList.innerHTML =
                    '<div class="muted">'
                    + 'Nincs felhasználó.'
                    + '</div>';

                return;
            }

            for (const user of users) {
                const isOwner =
                    user.role === "owner";

                const isSelf =
                    user.user_id
                    === currentUserId;

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "user-card";

                if (
                    !user.membership_is_active
                ) {
                    card.classList.add(
                        "inactive"
                    );
                }

                const roleSelectDisabled =
                    isOwner || isSelf;

                const activeDisabled =
                    isOwner || isSelf;

                card.innerHTML = `
                    <div class="user-header">
                        <div>
                            <div class="user-name">
                                ${escapeHtml(
                                    user.display_name
                                )}
                            </div>

<div class="user-email">
    @${escapeHtml(
        user.username
    )}
    ·
    ${escapeHtml(
        user.email
    )}
</div>

                        </div>

                        <div>
                            <span class="badge">
                                ${escapeHtml(
                                    roleLabel(
                                        user.role
                                    )
                                )}
                            </span>
                        </div>
                    </div>

                    <div class="user-grid">

                        <div>
                            <label>
                                Megjelenített név
                            </label>

                            <input
                                class="edit-name"
                                type="text"
                                value="${escapeHtml(
                                    user.display_name
                                )}"
                                ${isOwner ? "disabled" : ""}
                            >
                        </div>

                        <div>
                            <label>
                                Szerepkör
                            </label>

                            <select
                                class="edit-role"
                                ${
                                    roleSelectDisabled
                                        ? "disabled"
                                        : ""
                                }
                            >
                                <option
                                    value="viewer"
                                    ${
                                        user.role === "viewer"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Megtekintő
                                </option>

                                <option
                                    value="editor"
                                    ${
                                        user.role === "editor"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Szerkesztő
                                </option>

                                <option
                                    value="admin"
                                    ${
                                        user.role === "admin"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Adminisztrátor
                                </option>

                                ${
                                    isOwner
                                        ? `
                                            <option
                                                value="owner"
                                                selected
                                            >
                                                Tulajdonos
                                            </option>
                                        `
                                        : ""
                                }
                            </select>
                        </div>

                        <div>
                            <label>
                                Tagság
                            </label>

                            <div class="checkbox-row">
                                <input
                                    class="edit-active"
                                    type="checkbox"
                                    ${
                                        user.membership_is_active
                                            ? "checked"
                                            : ""
                                    }
                                    ${
                                        activeDisabled
                                            ? "disabled"
                                            : ""
                                    }
                                >

                                <span>
                                    Aktív
                                </span>
                            </div>
                        </div>

                    </div>

                    <div class="actions">
                        <button
                            type="button"
                            class="primary save-user"
                            ${isOwner ? "disabled" : ""}
                        >
                            Mentés
                        </button>
                    </div>

                    <div
                        class="status row-status"
                    ></div>
                `;

                const saveButton =
                    card.querySelector(
                        ".save-user"
                    );

                if (!isOwner) {
                    saveButton.addEventListener(
                        "click",
                        () => saveUser(
                            user,
                            card
                        )
                    );
                }

                usersList.appendChild(
                    card
                );
            }
        }


        async function loadUsers() {
            setStatus(
                usersStatus,
                "Betöltés..."
            );

            try {
                const users =
                    await apiFetch(
                        `/admin/households/${
                            activeHousehold.id
                        }/users`
                    );

                renderUsers(users);

                usersStatus.style.display =
                    "none";

            } catch (error) {
                setStatus(
                    usersStatus,
                    `❌ ${error.message}`,
                    "error"
                );
            }
        }


        async function saveUser(
            originalUser,
            card
        ) {
            const nameInput =
                card.querySelector(
                    ".edit-name"
                );

            const roleInput =
                card.querySelector(
                    ".edit-role"
                );

            const activeInput =
                card.querySelector(
                    ".edit-active"
                );

            const status =
                card.querySelector(
                    ".row-status"
                );

            const saveButton =
                card.querySelector(
                    ".save-user"
                );

            const payload = {};

            const newName =
                nameInput.value.trim();

            if (
                newName
                !== originalUser.display_name
            ) {
                payload.display_name =
                    newName;
            }

            if (
                !roleInput.disabled
                && roleInput.value
                !== originalUser.role
            ) {
                payload.role =
                    roleInput.value;
            }

            if (
                !activeInput.disabled
                && activeInput.checked
                !== originalUser
                    .membership_is_active
            ) {
                payload.membership_is_active =
                    activeInput.checked;
            }

            if (
                Object.keys(payload).length
                === 0
            ) {
                setStatus(
                    status,
                    "Nincs módosítás."
                );

                return;
            }

            saveButton.disabled = true;

            setStatus(
                status,
                "Mentés..."
            );

            try {
                await apiFetch(
                    `/admin/households/${
                        activeHousehold.id
                    }/users/${
                        originalUser.user_id
                    }`,
                    {
                        method: "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

                setStatus(
                    status,
                    "✅ Mentve.",
                    "success"
                );

                await loadUsers();

            } catch (error) {
                setStatus(
                    status,
                    `❌ ${error.message}`,
                    "error"
                );

            } finally {
                saveButton.disabled = false;
            }
        }


        async function createUser() {

const email =
    newEmail.value.trim();

const username =
    newUsername.value.trim();

const displayName =
    newDisplayName.value.trim();

            const password =
                newPassword.value;

if (
    !email
    || !username
    || !displayName
    || !password
) {

                setStatus(
                    createStatus,
                    "❌ Tölts ki minden mezőt.",
                    "error"
                );

                return;
            }

if (
    username.length < 3
    || username.length > 100
) {
    setStatus(
        createStatus,
        (
            "❌ A felhasználónév "
            + "3–100 karakter hosszú legyen."
        ),
        "error"
    );

    return;
}

if (
    !/^[\p{L}\p{N}._-]+$/u.test(
        username
    )
) {
    setStatus(
        createStatus,
        (
            "❌ A felhasználónév csak "
            + "betűt, számot, pontot, "
            + "kötőjelet és aláhúzást "
            + "tartalmazhat."
        ),
        "error"
    );

    return;
}

            if (password.length < 12) {
                setStatus(
                    createStatus,
                    (
                        "❌ A jelszó legalább "
                        + "12 karakter legyen."
                    ),
                    "error"
                );

                return;
            }

            createUserButton.disabled =
                true;

            setStatus(
                createStatus,
                "Létrehozás..."
            );

            try {
                await apiFetch(
                    `/admin/households/${
                        activeHousehold.id
                    }/users`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

body: JSON.stringify({
    email,
    username,
    display_name:
        displayName,
    password,
    role:
        newRole.value
})

                    }
                );

newEmail.value = "";
newUsername.value = "";
newDisplayName.value = "";
newPassword.value = "";

                newRole.value = "viewer";

                setStatus(
                    createStatus,
                    "✅ Felhasználó létrehozva.",
                    "success"
                );

                await loadUsers();

            } catch (error) {
                setStatus(
                    createStatus,
                    `❌ ${error.message}`,
                    "error"
                );

            } finally {
                createUserButton.disabled =
                    false;
            }
        }


        createUserButton.addEventListener(
            "click",
            createUser
        );

createCategoryButton.addEventListener(
    "click",
    createCategory
);

        logoutButton.addEventListener(
            "click",
            async () => {
                try {
                    await fetch(
                        "/auth/logout",
                        {
                            method: "POST"
                        }
                    );
                } finally {
                    window.location.href =
                        "/ui/login.html";
                }
            }
        );


async function initialize() {
    try {
        await loadContext();
        await loadUsers();
        await loadCategories();

    } catch (error) {

                console.error(
                    "Admin inicializálási hiba:",
                    error
                );
            }
        }


        initialize();
    </script>
