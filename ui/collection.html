.field-row label {

.field-row input,

.item-dynamic-fields {

.section-header {

.item-detail-title {

.item-detail-grid {

.item-detail-notes {

@media (max-width: 600px) {

    function roleLabel(role) {
        const labels = {
            owner: "Tulajdonos",
            admin: "Adminisztrátor",
            editor: "Szerkesztő",
            viewer: "Megtekintő"
        };

        return labels[role] || role;
    }


async function deleteActiveItem() {
    if (!activeItem) {
        return;
    }

    const confirmed =
        window.confirm(
            (
                "Biztosan inaktiválod ezt az elemet?\n\n"
                + activeItem.title
            )
        );

    if (!confirmed) {
        return;
    }

    deleteItemButton.disabled = true;

    try {
        const response =
            await fetch(
                `/items/${
                    encodeURIComponent(
                        activeItem.public_id
                    )
                }`,
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {
            let data = null;

            try {
                data =
                    await response.json();
            } catch {
                data = null;
            }

            throw new Error(
                data?.detail
                || `HTTP ${response.status}`
            );
        }

        activeItem = null;

        itemDetailSection.style.display =
            "none";

        itemDetailContent.innerHTML =
            "";

        itemEditContent.style.display =
            "none";

        await loadCollectionItems(
            activeHousehold,
            activeCategory,
            activeFields
        );

    } catch (error) {
        itemDetailStatus.style.display =
            "";

        itemDetailStatus.textContent =
            `❌ ${error.message}`;

    } finally {
        deleteItemButton.disabled =
            false;
    }
}


    function fieldTypeLabel(type) {
        const labels = {
            text: "Szöveg",
            long_text: "Hosszú szöveg",
            integer: "Egész szám",
            decimal: "Szám",
            boolean: "Igen / nem",
            date: "Dátum",
            year: "Év",
            url: "Webcím",
            email: "E-mail",
            single_select: "Egyszeres választás",
            multi_select: "Többszörös választás",
            barcode: "Vonalkód",
            image: "Kép",
            file: "Fájl"
        };

        return labels[type] || type;
    }


    function escapeHtml(value) {
        return String(value ?? "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    function renderFields(fields) {
        fieldList.innerHTML = "";

        if (!fields.length) {
            fieldList.innerHTML = `
                <div class="empty">
                    Ehhez a gyűjteményhez
                    még nincs mező definiálva.
                </div>
            `;

            return;
        }

        for (const field of fields) {
            const row =
                document.createElement("div");

            row.className = "field-row";

            row.innerHTML = `
                <div class="field-name">
                    ${escapeHtml(field.name)}
                </div>

                <div class="field-meta">
                    ${escapeHtml(
                        fieldTypeLabel(
                            field.field_type
                        )
                    )}

                    ${
                        field.is_required
                            ? " · kötelező"
                            : ""
                    }

                    · ${escapeHtml(field.field_key)}
                </div>
            `;

            fieldList.appendChild(row);
        }
    }


function renderDynamicFields(
    container,
    fields,
    item = null
) {
    container.innerHTML = "";

    for (const field of fields) {
        const currentValue =
            item
                ? getFieldValue(
                    item,
                    field
                )
                : null;

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.className =
            "field-row";

        let inputHtml = "";

        const required =
            field.is_required
                ? "required"
                : "";

        const scalarValue =
            currentValue === null
            || currentValue === undefined
                ? ""
                : String(currentValue);

        if (field.field_type === "long_text") {
            inputHtml = `
                <textarea
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    rows="4"
                    ${required}
                >${escapeHtml(
                    scalarValue
                )}</textarea>
            `;

        } else if (
            field.field_type === "integer"
            || field.field_type === "decimal"
            || field.field_type === "year"
        ) {
            inputHtml = `
                <input
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    type="number"
                    value="${escapeHtml(
                        scalarValue
                    )}"
                    ${required}
                >
            `;

        } else if (
            field.field_type === "boolean"
        ) {
            inputHtml = `
                <label>
                    <input
                        data-field-key="${escapeHtml(
                            field.field_key
                        )}"
                        data-field-type="${escapeHtml(
                            field.field_type
                        )}"
                        type="checkbox"
                        ${
                            currentValue === true
                                ? "checked"
                                : ""
                        }
                    >
                    Igen
                </label>
            `;

        } else if (
            field.field_type === "date"
        ) {
            inputHtml = `
                <input
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    type="date"
                    value="${escapeHtml(
                        scalarValue
                    )}"
                    ${required}
                >
            `;

        } else if (
            field.field_type === "email"
        ) {
            inputHtml = `
                <input
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    type="email"
                    value="${escapeHtml(
                        scalarValue
                    )}"
                    ${required}
                >
            `;

        } else if (
            field.field_type === "url"
        ) {
            inputHtml = `
                <input
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    type="url"
                    value="${escapeHtml(
                        scalarValue
                    )}"
                    ${required}
                >
            `;

        } else if (
            field.field_type
            === "single_select"
        ) {
            inputHtml = `
                <select
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    ${required}
                >
                    <option value="">
                        -- válassz --
                    </option>

                    ${field.options
                        .map(
                            option => `
                                <option
                                    value="${escapeHtml(
                                        option.value
                                    )}"
                                    ${
                                        currentValue
                                            === option.value
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    ${escapeHtml(
                                        option.label
                                    )}
                                </option>
                            `
                        )
                        .join("")}
                </select>
            `;

        } else if (
            field.field_type
            === "multi_select"
        ) {
            const selectedValues =
                Array.isArray(currentValue)
                    ? currentValue
                    : [];

            inputHtml = `
                <select
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    multiple
                    ${required}
                >
                    ${field.options
                        .map(
                            option => `
                                <option
                                    value="${escapeHtml(
                                        option.value
                                    )}"
                                    ${
                                        selectedValues
                                            .includes(
                                                option.value
                                            )
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    ${escapeHtml(
                                        option.label
                                    )}
                                </option>
                            `
                        )
                        .join("")}
                </select>

                <div class="field-help">
                    Több érték kijelöléséhez
                    Ctrl vagy Shift használható.
                </div>
            `;

        } else {
            inputHtml = `
                <input
                    data-field-key="${escapeHtml(
                        field.field_key
                    )}"
                    data-field-type="${escapeHtml(
                        field.field_type
                    )}"
                    type="text"
                    value="${escapeHtml(
                        scalarValue
                    )}"
                    ${required}
                >
            `;
        }

        wrapper.innerHTML = `
            <label>
                ${escapeHtml(field.name)}
                ${
                    field.is_required
                        ? " *"
                        : ""
                }
            </label>

            ${inputHtml}

            ${
                field.description
                    ? `
                        <div class="field-help">
                            ${escapeHtml(
                                field.description
                            )}
                        </div>
                    `
                    : ""
            }
        `;

        container.appendChild(
            wrapper
        );
    }
}

function getFieldValue(item, field) {
    const value =
        item.field_values?.find(
            itemValue =>
                itemValue.field_key
                === field.field_key
        );

    if (!value) {
        return null;
    }

switch (field.field_type) {
    case "integer":
    case "year":
        return value.value_integer;

    case "decimal":
        return value.value_decimal;

    case "boolean":
        return value.value_boolean;

    case "date":
        return value.value_date;

    case "single_select":
    case "multi_select":
        return value.value_json;

    default:
        return value.value_text;
}

}


function getOptionLabel(field, value) {
    const option =
        field.options?.find(
            item =>
                item.value === value
        );

    return option
        ? option.label
        : value;
}


function formatDynamicFieldValue(
    field,
    value
) {
    if (
        value === null
        || value === undefined
        || value === ""
    ) {
        return "-";
    }

    if (field.field_type === "boolean") {
        return value
            ? "Igen"
            : "Nem";
    }

    if (field.field_type === "single_select") {
        return getOptionLabel(
            field,
            value
        );
    }

    if (field.field_type === "multi_select") {
        if (!Array.isArray(value)) {
            return "-";
        }

        return value
            .map(
                item =>
                    getOptionLabel(
                        field,
                        item
                    )
            )
            .join(", ");
    }

    if (field.field_type === "date") {
        const date =
            new Date(
                `${value}T00:00:00`
            );

        if (!Number.isNaN(date.getTime())) {
            return date.toLocaleDateString(
                "hu-HU"
            );
        }
    }

    return String(value);
}

function formatItemDate(value) {
    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString(
        "hu-HU"
    );
}


function renderItemDetail(
    item,
    fields
) {
    const dynamicRows =
        fields
            .map(field => {
                const value =
                    getFieldValue(
                        item,
                        field
                    );

                const formattedValue =
                    formatDynamicFieldValue(
                        field,
                        value
                    );

                return `
                    <div class="item-detail-row">
                        <strong>
                            ${escapeHtml(
                                field.name
                            )}
                        </strong>

                        <span>
                            ${escapeHtml(
                                formattedValue
                            )}
                        </span>
                    </div>
                `;
            })
            .join("");

    itemDetailContent.innerHTML = `
        <div class="item-detail-title">
            ${escapeHtml(item.title)}
        </div>

        ${
            item.subtitle
                ? `
                    <div class="category-description">
                        ${escapeHtml(
                            item.subtitle
                        )}
                    </div>
                `
                : ""
        }

        <div class="item-detail-grid">
            ${dynamicRows}
        </div>

        ${
            item.notes
                ? `
                    <div class="item-detail-notes">
                        <strong>Megjegyzés</strong>

                        <div>
                            ${escapeHtml(
                                item.notes
                            )}
                        </div>
                    </div>
                `
                : ""
        }

        <div class="field-meta">
            Felvéve:
            ${escapeHtml(
                formatItemDate(
                    item.created_at
                )
            )}

            <br>

            Módosítva:
            ${escapeHtml(
                formatItemDate(
                    item.updated_at
                )
            )}
        </div>
    `;
}


async function openItemDetail(
    publicId
) {
    itemDetailSection.style.display =
        "";

    itemDetailContent.innerHTML = "";

    itemDetailStatus.style.display =
        "";

    itemDetailStatus.textContent =
        "Betöltés...";

    try {
        const response =
            await fetch(
                `/items/${
                    encodeURIComponent(
                        publicId
                    )
                }`
            );

        let item = null;

        try {
            item =
                await response.json();
        } catch {
            item = null;
        }

        if (!response.ok) {
            throw new Error(
                item?.detail
                || `HTTP ${response.status}`
            );
        }

        itemDetailStatus.style.display =
            "none";

activeItem = item;

        renderItemDetail(
            item,
            activeFields
        );

        itemDetailSection.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });

    } catch (error) {
        itemDetailStatus.style.display =
            "";

        itemDetailStatus.textContent =
            `❌ ${error.message}`;
    }
}

function openItemEditor() {
    if (!activeItem) {
        return;
    }

    editItemTitle.value =
        activeItem.title || "";

    editItemSubtitle.value =
        activeItem.subtitle || "";

    editItemNotes.value =
        activeItem.notes || "";

    renderDynamicFields(
        editDynamicFields,
        activeFields,
        activeItem
    );

    itemDetailContent.style.display =
        "none";

    itemEditContent.style.display =
        "";

    itemEditStatus.textContent =
        "";
}

async function saveItemEdit() {
    if (
        !activeItem
        || !activeHousehold
        || !activeCategory
    ) {
        return;
    }

    const title =
        editItemTitle.value.trim();

    if (!title) {
        itemEditStatus.textContent =
            "❌ A név / cím kötelező.";

        return;
    }

    const controls =
        editDynamicFields.querySelectorAll(
            "[data-field-key]"
        );

    for (const control of controls) {
        if (!control.reportValidity()) {
            return;
        }
    }

    saveItemEditButton.disabled = true;

    itemEditStatus.textContent =
        "Mentés...";

    try {
        const response =
            await fetch(
                `/items/${
                    encodeURIComponent(
                        activeItem.public_id
                    )
                }`,
                {
                    method: "PATCH",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        title,

                        subtitle:
                            editItemSubtitle
                                .value
                                .trim()
                            || null,

                        notes:
                            editItemNotes
                                .value
                                .trim()
                            || null,

                        field_values:
                            readDynamicFieldValuesFrom(
                                editDynamicFields
                            )
                    })
                }
            );

        let item = null;

        try {
            item =
                await response.json();
        } catch {
            item = null;
        }

        if (!response.ok) {
            throw new Error(
                item?.detail
                || `HTTP ${response.status}`
            );
        }

        activeItem = item;

        renderItemDetail(
            item,
            activeFields
        );

        itemEditContent.style.display =
            "none";

        itemDetailContent.style.display =
            "";

        itemEditStatus.textContent =
            "";

        await loadCollectionItems(
            activeHousehold,
            activeCategory,
            activeFields
        );

    } catch (error) {
        itemEditStatus.textContent =
            `❌ ${error.message}`;

    } finally {
        saveItemEditButton.disabled =
            false;
    }
}


editItemButton.addEventListener(
    "click",

);

deleteItemButton.addEventListener(

);

saveItemEditButton.addEventListener(
    "click",

);

cancelItemEditButton.addEventListener(

async function loadCollectionItems(
    household,
    category,
    fields
) {
    itemsStatus.style.display = "";

    itemsStatus.textContent =
        "Betöltés...";

    itemsList.innerHTML = "";

    try {

const offset =
    (currentItemPage - 1)
    * itemPageSize;

const parameters =
    new URLSearchParams({
        household_id:
            String(household.id),

        category_id:
            String(category.id),

        sort_by:
            currentItemSortBy,

        sort_direction:
            currentItemSortDirection,

        limit:
            String(itemPageSize),

        offset:
            String(offset)
    });

if (currentItemSearch) {
    parameters.set(
        "query",
        currentItemSearch
    );
}

const response =
    await fetch(
        `/items?${parameters.toString()}`
    );

        let data = null;

        try {
            data =
                await response.json();
        } catch {
            data = null;
        }

        if (!response.ok) {
            throw new Error(
                data?.detail
                || `HTTP ${response.status}`
            );
        }

const totalItems =
    Number(data.total) || 0;

const totalPages =
    Math.max(
        1,
        Math.ceil(
            totalItems / itemPageSize
        )
    );

if (
    currentItemPage > totalPages
    && totalItems > 0
) {
    currentItemPage =
        totalPages;

    return loadCollectionItems(
        household,
        category,
        fields
    );
}

pageInfo.textContent =
    totalItems
        ? (
            `${currentItemPage}. / `
            + `${totalPages}. oldal`
            + ` · ${totalItems} elem`
        )
        : "0 elem";

previousPageButton.disabled =
    currentItemPage <= 1;

nextPageButton.disabled =
    currentItemPage >= totalPages
    || totalItems === 0;

        itemsStatus.style.display =
            "none";

        if (!data.items.length) {
            itemsList.innerHTML = `
                <div class="empty">
                    Ebben a gyűjteményben
                    még nincs elem.
                </div>
            `;

            return;
        }

const visibleFields =
    fields.filter(
        field =>
            field.is_visible_in_list
    );

        for (const item of data.items) {
            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "field-row";

row.innerHTML = `
    <div class="field-name">
        ${escapeHtml(item.title)}
    </div>

    ${
        item.subtitle
            ? `
                <div class="category-description">
                    ${escapeHtml(
                        item.subtitle
                    )}
                </div>
            `
            : ""
    }

    ${
        visibleFields.length
            ? `
                <div class="item-dynamic-fields">
                    ${visibleFields
                        .map(
                            field => {
                                const value =
                                    getFieldValue(
                                        item,
                                        field
                                    );

                                return `
                                    <div class="item-dynamic-field">
                                        <strong>
                                            ${escapeHtml(
                                                field.name
                                            )}:
                                        </strong>

                                        ${escapeHtml(
                                            formatDynamicFieldValue(
                                                field,
                                                value
                                            )
                                        )}
                                    </div>
                                `;
                            }
                        )
                        .join("")}
                </div>
            `
            : ""
    }

    <div class="field-meta">
        Felvéve:
        ${escapeHtml(
            formatItemDate(
                item.created_at
            )
        )}
    </div>
`;

row.tabIndex = 0;

row.style.cursor =
    "pointer";

row.addEventListener(
    "click",
    () => {
        openItemDetail(
            item.public_id
        );
    }
);

row.addEventListener(
    "keydown",
    event => {
        if (
            event.key === "Enter"
            || event.key === " "
        ) {
            event.preventDefault();

            openItemDetail(
                item.public_id
            );
        }
    }
);

            itemsList.appendChild(
                row
            );
        }

} catch (error) {
    itemsStatus.style.display = "";

    itemsStatus.textContent =
        `❌ ${error.message}`;

    pageInfo.textContent = "";

    previousPageButton.disabled =
        true;

    nextPageButton.disabled =
        true;
}

}

function readDynamicFieldValuesFrom(
    container
) {
    const fieldValues = {};

    const controls =
        container.querySelectorAll(
            "[data-field-key]"
        );

    for (const control of controls) {
        const fieldKey =
            control.dataset.fieldKey;

        const fieldType =
            control.dataset.fieldType;

        if (fieldType === "boolean") {
            fieldValues[fieldKey] =
                control.checked;

            continue;
        }

        if (fieldType === "multi_select") {
            const values =
                Array.from(
                    control.selectedOptions
                )
                .map(
                    option =>
                        option.value
                );

            if (values.length) {
                fieldValues[fieldKey] =
                    values;
            }

            continue;
        }

        const rawValue =
            control.value.trim();

        if (!rawValue) {
            continue;
        }

        if (
            fieldType === "integer"
            || fieldType === "year"
        ) {
            fieldValues[fieldKey] =
                Number.parseInt(
                    rawValue,
                    10
                );

            continue;
        }

        if (fieldType === "decimal") {
            fieldValues[fieldKey] =
                Number(rawValue);

            continue;
        }

        fieldValues[fieldKey] =
            rawValue;
    }

    return fieldValues;
}

function readDynamicFieldValues() {
    return readDynamicFieldValuesFrom(
        dynamicCreateFields
    );
}

async function createCollectionItem(
    household,
    category
) {
    const title =
        itemTitle.value.trim();

    if (!title) {
        createItemStatus.textContent =
            "❌ A név / cím kötelező.";

        return;
    }

    if (!itemTitle.reportValidity()) {
        return;
    }

    const dynamicControls =
        dynamicCreateFields.querySelectorAll(
            "[data-field-key]"
        );

    for (const control of dynamicControls) {
        if (!control.reportValidity()) {
            return;
        }
    }

    createItemButton.disabled = true;

    createItemStatus.textContent =
        "Mentés...";

    try {
        const result =
            await fetch(
                "/items",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        household_id:
                            household.id,

                        category_id:
                            category.id,

                        title,

                        subtitle:
                            itemSubtitle
                                .value
                                .trim()
                            || null,

                        notes:
                            itemNotes
                                .value
                                .trim()
                            || null,

                        status:
                            "active",

                        field_values:
                            readDynamicFieldValues()
                    })
                }
            );

        let data = null;

        try {
            data =
                await result.json();
        } catch {
            data = null;
        }

        if (!result.ok) {
            throw new Error(
                data?.detail
                || `HTTP ${result.status}`
            );
        }

        createItemStatus.textContent =
            "✅ Elem sikeresen létrehozva.";

        itemTitle.value = "";
        itemSubtitle.value = "";
        itemNotes.value = "";

        const controls =
            dynamicCreateFields.querySelectorAll(
                "[data-field-key]"
            );

        for (const control of controls) {
            if (control.type === "checkbox") {
                control.checked = false;

            } else if (control.multiple) {
                for (
                    const option
                    of control.options
                ) {
                    option.selected = false;
                }

            } else {
                control.value = "";
            }
        }

currentItemPage = 1;

await loadCollectionItems(
    household,
    category,
    activeFields
);

        itemTitle.focus();

    } catch (error) {
        console.error(
            "Elem létrehozási hiba:",
            error
        );

        createItemStatus.textContent =
            `❌ ${error.message}`;

    } finally {
        createItemButton.disabled =
            false;
    }
}

closeItemDetailButton.addEventListener(
    "click",
    () => {
activeItem = null;

itemEditContent.style.display =
    "none";

itemDetailContent.style.display =
    "";
        itemDetailSection.style.display =
            "none";

        itemDetailContent.innerHTML =
            "";

        itemDetailStatus.style.display =
            "none";
    }
);

    async function initializeCollectionPage() {
        try {
            const parameters =
                new URLSearchParams(
                    window.location.search
                );

            const categoryId =
                Number(
                    parameters.get(
                        "category_id"
                    )
                );

            if (
                !Number.isInteger(categoryId)
                || categoryId <= 0
            ) {
                throw new Error(
                    "Hiányzó vagy hibás kategóriaazonosító."
                );
            }


            const contextResponse =
                await fetch(
                    "/auth/context"
                );

            if (contextResponse.status === 401) {
                window.location.href =
                    "/ui/login.html";

                return;
            }

            if (!contextResponse.ok) {
                throw new Error(
                    "A jogosultságok betöltése "
                    + "sikertelen."
                );
            }

            const context =
                await contextResponse.json();


            const storedHouseholdId =
                Number(
                    localStorage.getItem(
                        "activeHouseholdId"
                    )
                );

            const household =
                context.households.find(
                    item =>
                        item.id
                        === storedHouseholdId
                )
                || context.households[0]
                || null;

            if (!household) {
                throw new Error(
                    "Nincs aktív háztartási tagság."
                );
            }

            localStorage.setItem(
                "activeHouseholdId",
                String(household.id)
            );


            const categoriesResponse =
                await fetch(
                    `/households/${
                        household.id
                    }/categories`
                );

            if (!categoriesResponse.ok) {
                throw new Error(
                    "A gyűjtemények betöltése "
                    + "sikertelen."
                );
            }

            const categories =
                await categoriesResponse.json();

            const category =
                categories.find(
                    item =>
                        item.id === categoryId
                );

            if (!category) {
                throw new Error(
                    "A kiválasztott gyűjtemény "
                    + "nem érhető el."
                );
            }


            const fieldsResponse =
                await fetch(
                    `/households/${
                        household.id
                    }/categories/${
                        category.id
                    }/fields`
                );

            if (!fieldsResponse.ok) {
                throw new Error(
                    "A meződefiníciók betöltése "
                    + "sikertelen."
                );
            }

            const fields =
                await fieldsResponse.json();

activeHousehold = household;
activeCategory = category;
activeFields = fields;

            document.title =
                `FamilyCollection – ${
                    category.name
                }`;

            pageTitle.textContent =
                category.name;

            householdName.textContent =
                household.name;

            categoryName.textContent =
                category.name;

            categoryDescription.textContent =
                category.description
                || "Nincs leírás.";

            permission.textContent =
                `Jogosultság: ${
                    roleLabel(
                        household.role
                    )
                }`;

renderFields(fields);

const canEdit =
    household.role === "editor"
    || household.role === "admin"
    || household.role === "owner";

editItemButton.style.display =
    canEdit
        ? ""
        : "none";

deleteItemButton.style.display =
    canEdit
        ? ""
        : "none";

if (canEdit) {
    renderCreateFields(fields);

    createSection.style.display =
        "";
}

await loadCollectionItems(
    household,
    category,
    fields
);

statusBox.style.display =
    "none";

content.style.display =
    "";

        } catch (error) {
            console.error(
                "Gyűjteményoldal "
                + "inicializálási hiba:",
                error
            );

            statusBox.textContent =
                `❌ ${error.message}`;
        }
    }

let itemSearchTimer = null;


itemSearch.addEventListener(
    "input",
    event => {
        clearTimeout(
            itemSearchTimer
        );

        itemSearchTimer =
            setTimeout(
                async () => {
                    currentItemSearch =
                        event.target.value.trim();

                    currentItemPage = 1;

                    if (
                        activeHousehold
                        && activeCategory
                    ) {
                        await loadCollectionItems(
                            activeHousehold,
                            activeCategory,
                            activeFields
                        );
                    }
                },
                350
            );
    }
);


itemSort.addEventListener(
    "change",
    async event => {
        const [
            sortBy,
            sortDirection
        ] =
            event.target.value.split(
                ":"
            );

        currentItemSortBy =
            sortBy;

        currentItemSortDirection =
            sortDirection;

        currentItemPage = 1;

        if (
            activeHousehold
            && activeCategory
        ) {
            await loadCollectionItems(
                activeHousehold,
                activeCategory,
                activeFields
            );
        }
    }
);


previousPageButton.addEventListener(
    "click",
    async () => {
        if (
            currentItemPage <= 1
            || !activeHousehold
            || !activeCategory
        ) {
            return;
        }

        currentItemPage -= 1;

        await loadCollectionItems(
            activeHousehold,
            activeCategory,
            activeFields
        );
    }
);


nextPageButton.addEventListener(
    "click",
    async () => {
        if (
            nextPageButton.disabled
            || !activeHousehold
            || !activeCategory
        ) {
            return;
        }

        currentItemPage += 1;

        await loadCollectionItems(
            activeHousehold,
            activeCategory,
            activeFields
        );
    }
);

createItemButton.addEventListener(
    "click",
    () => {
        if (
            !activeHousehold
            || !activeCategory
        ) {
            createItemStatus.textContent =
                "❌ A gyűjtemény még nem töltődött be.";

            return;
        }

        createCollectionItem(
            activeHousehold,
            activeCategory
        );
    }
);

    initializeCollectionPage();
