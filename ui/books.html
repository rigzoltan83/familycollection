<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #fff;
}

header {
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 12px;
    display: flex;
    gap: 10px;
    align-items: center;
    background: #1b1b1b;
    border-bottom: 1px solid #333;
}

header a {
    color: #6dff6d;
    text-decoration: none;
    font-weight: bold;
    white-space: nowrap;
}

header input {
    flex: 1;
    min-width: 0;
    padding: 11px;
    font-size: 16px;
    border: 1px solid #444;
    border-radius: 7px;
    background: #292929;
    color: #fff;
}

#summary {
    padding: 10px 14px 0;
    color: #aaa;
    font-size: 14px;
}

#list {
    padding: 10px;
}

#pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 8px 12px 22px;
}

#pagination button {
    min-width: 110px;
    padding: 10px 14px;
    border: none;
    border-radius: 7px;
    background: #237c45;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

#pagination button:hover:not(:disabled) {
    background: #2d9b59;
}

#pagination button:disabled {
    background: #444;

}

#pageInfo {

    font-size: 14px;

.modal {

    inset: 0;
    z-index: 100;

}

<script>
window.FC_BASE_PATH = (() => {
    const marker = "/ui/";
    const index = window.location.pathname.indexOf(marker);

    if (index <= 0) {
        return "";
    }

    return window.location.pathname.slice(0, index);
})();

window.fcUrl = (path) => {
    if (!path) {
        return window.FC_BASE_PATH || "/";
    }

    if (!path.startsWith("/")) {
        path = "/" + path;
    }

    return window.FC_BASE_PATH + path;
};
</script>

<script>
"use strict";

const imageLightbox =
    document.getElementById(
        "imageLightbox"
    );

const imageLightboxImage =
    document.getElementById(
        "imageLightboxImage"
    );

const imageLightboxClose =
    document.getElementById(
        "imageLightboxClose"
    );

function openImageLightbox(
    imageUrl,
    altText = ""
) {
    if (
        !imageLightbox
        || !imageLightboxImage
    ) {
        return;
    }

    imageLightboxImage.src =
        imageUrl || "";

    imageLightboxImage.alt =
        altText || "";

    imageLightbox.classList.add(
        "open"
    );

    document.body.style.overflow =
        "hidden";
}

function closeImageLightbox() {
    if (
        !imageLightbox
        || !imageLightboxImage
    ) {
        return;
    }

    imageLightbox.classList.remove(
        "open"
    );

    imageLightboxImage.src = "";
    imageLightboxImage.alt = "";

    document.body.style.overflow = "";
}

let allBooks = [];

let canEditBooks = false;

let editorStorageLocations = [];

let editorStorageByPublicId = new Map();

let editorImages = [];

let currentPage = 1;
const pageSize = 50;

let totalPages = 1;
let totalBooks = 0;
let currentSearch = "";

let searchTimer = null;

/* -----------------------
   SEGÉDFÜGGVÉNYEK
----------------------- */

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

async function loadBookPagePermissions() {
    const response =
        await fetch(fcUrl("/auth/context"));

    if (response.status === 401) {
        window.location.href =
            fcUrl("/ui/login.html");

        return false;
    }

    if (!response.ok) {
        throw new Error(
            `HTTP ${response.status}`
        );
    }

    const context =
        await response.json();

    const storedHouseholdId =
        Number(
            localStorage.getItem(
                "activeHouseholdId"
            )
        );

    const household =
        context.households.find(
            item =>
                item.id === storedHouseholdId
        )
        || context.households[0]
        || null;

    if (!household) {
throw new Error(
    FamilyCollectionI18n.t(
        "dashboard.no_household"
    )
);
    }

    localStorage.setItem(
        "activeHouseholdId",
        String(household.id)
    );

    canEditBooks =

function normalizeText(value) {
    return String(value ?? "")
        .trim()
        .toLocaleLowerCase("hu-HU");
}

function formatDate(value) {
    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    const locale =
        FamilyCollectionI18n.getLanguage()
        === "hu"
            ? "hu-HU"
            : "en-GB";

    return date.toLocaleString(locale);
}

function isRemoved(book) {
    const room = normalizeText(book.room);

    return (
        room === normalizeText("Polcról levéve") ||
        room === normalizeText("Levéve")
    );
}

function isBorrowed(book) {
    return Boolean(book.borrower) ||
        normalizeText(book.room) === normalizeText("Kölcsönadva");
}

function getStatus(book) {
    if (isBorrowed(book)) {
        return {
            cardClass: "borrowed",
            textClass: "status-borrowed",
            text: book.borrower
                ? FamilyCollectionI18n.t(
                    "books.list.status.borrowed_by",
                    {
                        borrower:
                            book.borrower
                    }
                )
                : FamilyCollectionI18n.t(
                    "books.list.status.borrowed"
                )
        };
    }

    if (isRemoved(book)) {
        return {
            cardClass: "removed",
            textClass: "status-removed",
            text:
                FamilyCollectionI18n.t(
                    "books.list.status.removed"
                )
        };
    }

    return {
        cardClass: "",
        textClass: "status-normal",
        text:
            FamilyCollectionI18n.t(
                "books.list.status.on_shelf"
            )
    };
}

function getLocation(book) {
    if (isBorrowed(book)) {
        return book.borrower
            ? FamilyCollectionI18n.t(
                "books.latest.borrowed_by",
                {
                    borrower:
                        book.borrower
                }
            )
            : FamilyCollectionI18n.t(
                "books.status.borrowed"
            );
    }

    if (isRemoved(book)) {
        return FamilyCollectionI18n.t(
            "books.status.removed"
        );
    }

    const parts = [];

    if (book.room) {
        parts.push(book.room);
    }

    if (
        book.shelf
        && book.shelf !== "-"
    ) {
        parts.push(book.shelf);
    }

    if (
        book.slot !== null
        && book.slot !== undefined
        && book.slot !== ""
    ) {
        parts.push(
            FamilyCollectionI18n.t(
                "books.latest.slot",
                {
                    slot: book.slot
                }
            )
        );
    }

    return parts.length
        ? parts.join(" / ")
        : FamilyCollectionI18n.t(
            "books.latest.location_missing"
        );
}

async function loadBooks(page = currentPage) {
    const list = document.getElementById("list");

    currentPage = Math.max(1, Number(page) || 1);

    const params = new URLSearchParams({
        page: String(currentPage),
        page_size: String(pageSize)
    });

    if (currentSearch.trim()) {
        params.set(
            "search",
            currentSearch.trim()
        );
    }

list.innerHTML = `
    <div class="empty">
        ${escapeHtml(
            FamilyCollectionI18n.t(
                "books.list.loading"
            )
        )}
    </div>
`;

    try {
        const response = await fetch(fcUrl(`/books/all?${params.toString()}`)
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        if (
            !data ||
            !Array.isArray(data.books)
        ) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.invalid_response"
    )
);
        }

        allBooks = data.books;

        currentPage =
            Number(data.page) || 1;

        totalPages =
            Math.max(
                1,
                Number(data.total_pages) || 1
            );

        totalBooks =
            Math.max(
                0,
                Number(data.total) || 0
            );

        /*
         * Ha az utolsó oldal utolsó könyvét töröltük,
         * visszalépünk az új utolsó oldalra.
         */
        if (
            currentPage > totalPages &&
            totalPages >= 1
        ) {
            await loadBooks(totalPages);
            return;
        }

        render(allBooks);
        renderPagination();

    } catch (error) {
console.error(
    "Book list load error:",
    error
);

list.innerHTML = `
    <div class="error">
        ${escapeHtml(
            FamilyCollectionI18n.t(
                "books.list.load_failed",
                {
                    message:
                        error.message
                }
            )
        )}
    </div>
`;

        totalBooks = 0;
        totalPages = 1;

        renderPagination();
    }
}

if (data.status === "error") {

function flattenStorageTree(
    nodes,
    depth = 0,
    result = [],
    rootName = null,
    parentPath = []
) {
    for (const node of nodes) {
        const effectiveRootName =
            rootName || node.name;

        const currentPath = [
            ...parentPath,
            node.name
        ];

        result.push({
            ...node,
            depth,
            root_name: effectiveRootName,
            path_names: currentPath,
            path_label: currentPath
                .filter(
                    part =>
                        part
                        && part !== "-"
                )
                .join(" / ")
        });

        flattenStorageTree(
            node.children || [],
            depth + 1,
            result,
            effectiveRootName,
            currentPath
        );
    }

    return result;
}

async function loadEditorPlaces() {
    if (editorStorageLocations.length) {
        return;
    }

const response = await fetch(fcUrl("/storage/tree")
    + "?household_id=1"
    + "&include_inactive=true"
);

    if (!response.ok) {
        throw new Error(
            `HTTP ${response.status}`
        );
    }

    const data = await response.json();

    if (
        !data
        || !Array.isArray(data.locations)
    ) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.storage.invalid_response"
    )
);
    }

editorStorageLocations =
    flattenStorageTree(
        data.locations
    ).filter(
        location =>
            location.location_type === "slot"
    );

    editorStorageByPublicId = new Map(
        editorStorageLocations.map(
            location => [
                location.public_id,
                location
            ]
        )
    );

    const select =
        document.getElementById(
            "editLocation"
        );

    select.innerHTML = "";
filterEditorStorageOptions();
}

function filterEditorStorageOptions() {
    const query =
        normalizeText(
            document
                .getElementById(
                    "editLocationSearch"
                )
                .value
        );

    const select =
        document.getElementById(
            "editLocation"
        );

    const currentValue =
        select.value;

    select.innerHTML = "";

    const locationsByRoot = new Map();

    for (
        const location
        of editorStorageLocations
    ) {
        const searchableText =
            normalizeText(
                [
                    location.root_name,
                    location.path_label,
                    location.name,
                    location.slug
                ].join(" ")
            );

        if (
            query
            && !searchableText.includes(query)
        ) {
            continue;
        }

const rootName =
    location.root_name
    || FamilyCollectionI18n.t(
        "common.other"
    );

        if (!locationsByRoot.has(rootName)) {
            locationsByRoot.set(
                rootName,
                []
            );
        }

        locationsByRoot
            .get(rootName)
            .push(location);
    }

    for (
        const [
            rootName,
            locations
        ]
        of locationsByRoot
    ) {
        const group =
            document.createElement(
                "optgroup"
            );

        group.label = rootName;

        for (const location of locations) {
            const option =
                document.createElement(
                    "option"
                );

            option.value =
                location.public_id;

            const relativePath =
                location.path_names
                    .slice(1)
                    .filter(
                        part =>
                            part
                            && part !== "-"
                    )
                    .join(" / ");

option.textContent =
    location.is_active
        ? (
            relativePath
            || location.name
        )
        : FamilyCollectionI18n.t(
            "books.list.storage.inactive",
            {
                name:
                    relativePath
                    || location.name
            }
        );

            option.disabled =
                !location.is_active;

            group.appendChild(option);
        }

        select.appendChild(group);
    }

    if (
        currentValue
        && editorStorageByPublicId.has(
            currentValue
        )
    ) {
        select.value = currentValue;
    }

    syncEditorBorrower();
}

const selected =

    if (!response.ok) {
throw new Error(
    FamilyCollectionI18n.t(

}

async function refreshEditorImages() {
    const itemPublicId =
        document
            .getElementById("editItemPublicId")
            .value

async function uploadEditorImageFiles(
    fileList
) {
    const files = Array.from(
        fileList || []
    );

    if (files.length === 0) {
        return;
    }

    const itemPublicId =
        document
            .getElementById("editItemPublicId")
            .value
            .trim();

    if (!itemPublicId) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.images.missing_item_id"
    )
);
    }

    const statusElement =
        document.getElementById(
            "editImageStatus"
        );

    const cameraButton =
        document.getElementById(
            "editImageCameraButton"
        );

    const filesButton =
        document.getElementById(
            "editImageFilesButton"
        );

    cameraButton.disabled = true;
    filesButton.disabled = true;

    let uploadedCount = 0;

    try {
        for (const file of files) {
statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.upload_progress",
        {
            current: uploadedCount + 1,
            total: files.length
        }
    );

            const formData =
                new FormData();

            formData.append(
                "file",
                file,
                file.name || "photo.jpg"
            );

            const response =
                await fetch(fcUrl(`/items/${itemPublicId}/images`),
                    {
                        method: "POST",
                        body: formData
                    }
                );

            let data = null;

            try {
                data = await response.json();
            } catch {
                data = null;
            }

            if (!response.ok) {
                throw new Error(
                    data?.detail
                    || `HTTP ${response.status}`
                );
            }

            uploadedCount += 1;
        }

statusElement.textContent =
    uploadedCount === 1
        ? FamilyCollectionI18n.t(
            "books.list.images.upload_success_one"
        )
        : FamilyCollectionI18n.t(
            "books.list.images.upload_success_many",
            {
                count: uploadedCount
            }
        );

        await refreshEditorImages();

    } catch (error) {
console.error(
    "Image upload error:",
    error
);

statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.upload_error",
        {
            message: error.message
        }
    );

    } finally {
        cameraButton.disabled = false;
        filesButton.disabled = false;
    }
}

async function moveEditorImage(
    imagePublicId,
    direction
) {
    if (!imagePublicId) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.images.missing_image_id"
    )
);
    }

    if (
        direction !== "left"
        && direction !== "right"
    ) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.images.invalid_move_direction"
    )
);
    }

    const currentIndex =
        editorImages.findIndex(
            image =>
                image.public_id
                === imagePublicId
        );

    if (currentIndex < 0) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.images.move_not_found"
    )
);
    }

    const currentImage =
        editorImages[currentIndex];

    if (currentImage.is_primary) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.images.primary_move_forbidden"
    )
);
    }

    const firstMovableIndex =
        editorImages[0]?.is_primary
            ? 1
            : 0;

    const targetIndex =
        direction === "left"
            ? currentIndex - 1
            : currentIndex + 1;

    if (
        targetIndex < firstMovableIndex
        || targetIndex
            >= editorImages.length
    ) {
        return false;
    }

    const reorderedImages = [
        ...editorImages
    ];

    [
        reorderedImages[currentIndex],
        reorderedImages[targetIndex]
    ] = [
        reorderedImages[targetIndex],
        reorderedImages[currentIndex]
    ];

    const statusElement =
        document.getElementById(
            "editImageStatus"
        );

statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.order_saving"
    );

    try {
        for (
            let index = 0;
            index < reorderedImages.length;
            index += 1
        ) {
            const image =
                reorderedImages[index];

            const newSortOrder =
                index * 10;

            if (
                image.sort_order
                === newSortOrder
            ) {
                continue;
            }

            const response =
                await fetch(fcUrl(`/item-images/${image.public_id}`),
                    {
                        method: "PATCH",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            sort_order:
                                newSortOrder
                        })
                    }
                );

            let data = null;

            try {
                data =
                    await response.json();
            } catch {
                data = null;
            }

            if (!response.ok) {
                throw new Error(
                    data?.detail
                    || `HTTP ${response.status}`
                );
            }
        }

        await refreshEditorImages();

statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.order_saved"
    );

        return true;

    } catch (error) {
console.error(
    "Image order save error:",
    error
);

statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.order_error",
        {
            message: error.message
        }
    );

        /*
         * Hiba esetén visszatöltjük a szerveren
         * ténylegesen tárolt sorrendet.
         */
        try {
            await refreshEditorImages();
        } catch (refreshError) {
console.error(
    "Gallery refresh error:",
    refreshError
);
        }

        return false;
    }
}

async function deleteEditorImage(
    imagePublicId
) {
    if (!imagePublicId) {
throw new Error(
    FamilyCollectionI18n.t(
        "books.list.images.missing_image_id"
    )
);
    }

const confirmed = window.confirm(
    FamilyCollectionI18n.t(
        "books.list.images.delete_confirm"
    )
);

    if (!confirmed) {
        return false;
    }

    const statusElement =
        document.getElementById(
            "editImageStatus"
        );

statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.deleting"
    );

    try {
        const response =
            await fetch(fcUrl(`/item-images/${imagePublicId}`),
                {
                    method: "DELETE"
                }
            );

        if (!response.ok) {
            let detail = null;

            try {
                const data =
                    await response.json();

                detail = data?.detail;
            } catch {
                detail = null;
            }

            throw new Error(
                detail
                || `HTTP ${response.status}`
            );
        }

        await refreshEditorImages();

statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.deleted"
    );
        return true;

    } catch (error) {
console.error(
    "Image deletion error:",
    error
);

statusElement.textContent =
    FamilyCollectionI18n.t(
        "books.list.images.delete_error",
        {
            message: error.message
        }
    );
        return false;
    }
}

);

        ...images

    gallery.innerHTML = images
        .map((image, imageIndex) => {

                images[0]?.is_primary

            const canMoveRight =

<div class="edit-image-actions">

            image.public_id
        )}"

title="${escapeHtml(
    FamilyCollectionI18n.t(

    )

>

    <button

    )
)}"
>
    ${escapeHtml(

            "books.list.images.move_right_button"

    </button>
<button

>

                "books.list.images.current_primary"
            )

}
</button>

    <button

${escapeHtml(

function closeEditor() {
    const params =
        new URLSearchParams(
            window.location.search
        );

    const embedded =
        params.get("embedded") === "1";

    if (embedded) {
        window.parent.postMessage(
            {
                type: "familycollection-close-book-editor"
            },
            window.location.origin
        );

        return;
    }

    document
        .getElementById("editModal")
        .style.display = "none";
}

/* -----------------------
   SZERKESZTÉS MENTÉSE
----------------------- */

async function saveEditor() {
    const bookId = Number(
        document.getElementById("editId").value
    );

const storagePublicId =
    document
        .getElementById("editLocation")
        .value;

const selected =
    editorStorageByPublicId.get(
        storagePublicId
    );

const isBorrowed =
    normalizeText(selected?.root_name) ===
    normalizeText("Kölcsönadva");

    const editStatus =
        document.getElementById("editStatus");

    const isbn =
        document
            .getElementById("editIsbn")
            .value
            .replaceAll("-", "")
            .replaceAll(" ", "")
            .trim();

    const title =
        document
            .getElementById("editTitle")
            .value
            .trim();

if (!isbn) {
    editStatus.textContent =
        FamilyCollectionI18n.t(
            "books.list.edit.isbn_required"
        );
    return;
}

if (!title) {
    editStatus.textContent =
        FamilyCollectionI18n.t(
            "books.list.edit.title_required"
        );
    return;
}

if (!storagePublicId) {
    editStatus.textContent =
        FamilyCollectionI18n.t(
            "books.list.edit.storage_required"
        );
    return;
}

    const borrower =
        document
            .getElementById("editBorrower")
            .value
            .trim();

if (isBorrowed && !borrower) {
    editStatus.textContent =
        FamilyCollectionI18n.t(
            "books.list.edit.borrower_required"
        );
    return;
}

editStatus.textContent =
    FamilyCollectionI18n.t(
        "common.saving"
    );

    try {
        const response =
            await fetch(fcUrl(`/books/${bookId}`), {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    isbn: isbn,

                    title: title,

                    author:
                        document
                            .getElementById(
                                "editAuthor"
                            )
                            .value
                            .trim() || null,

                    publisher:
                        document
                            .getElementById(
                                "editPublisher"
                            )
                            .value
                            .trim() || null,

                    publish_year:
                        document
                            .getElementById(
                                "editYear"
                            )
                            .value
                            .trim() || null,

storage_public_id:
    storagePublicId,

                    borrower:
                        isBorrowed
                        ? borrower
                        : null
                })
            });

        const data = await response.json();

        if (
            !response.ok ||
            data.status === "error"
        ) {
            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );
        }

if (data.status === "not_found") {
    throw new Error(
        FamilyCollectionI18n.t(
            "books.list.edit.not_found"
        )
    );
}

        closeEditor();

        await loadBooks();

} catch (error) {
    console.error(
        "Book save error:",
        error
    );

    editStatus.textContent =
        FamilyCollectionI18n.t(
            "books.list.edit.save_error",
            {
                message: error.message
            }
        );
}
}

async function initializeBooksPage() {
    try {
        const params =
            new URLSearchParams(
                window.location.search
            );

        const embedded =
            params.get("embedded") === "1";

        if (embedded) {
            document.body.classList.add(
                "embedded-book-editor"
            );
        }

        const permissionLoaded =
            await loadBookPagePermissions();

        if (!permissionLoaded) {
            return;
        }

        await loadBooks();

        const editId =
            Number(
                params.get("edit")
            );

        if (
            Number.isInteger(editId)
            && editId > 0
        ) {
            await editBook(editId);
        }

    } catch (error) {
console.error(
    "Book list initialization error:",
    error
);

        const list =
            document.getElementById(
                "list"
            );

        if (list) {
list.innerHTML = `
    <div class="empty">
        ${escapeHtml(
            FamilyCollectionI18n.t(
                "books.list.permissions_load_failed"
            )
        )}
    </div>
`;
        }
    }
}

initializeBooksPage();
