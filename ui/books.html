<head>

<style>

}

    margin-bottom: 12px;

}

.card.removed {

}

}

}

}

.status-removed {

}

}

.actions {

    gap: 8px;

.actions button {
    flex: 1;

    font-size: 14px;
}

.edit {
    background: #2563a8;
}

.edit:hover {

}

.del {

}

.del:hover {

}

.empty,

    padding: 20px;

}

}

/* -----------------------
   SZERKESZTŐABLAK
----------------------- */

.modal {
    display: none;
    position: fixed;
    inset: 0;

    overflow-y: auto;
}

.modal-content {

    max-width: 620px;
    margin: 20px auto;

.modal-header {

}

.modal-close {

.modal-content label {

.modal-content input,

<script>
"use strict";

let allBooks = [];

let editorStorageLocations = [];
let editorStorageByPublicId = new Map();

let currentPage = 1;
const pageSize = 50;

let totalPages = 1;
let totalBooks = 0;
let currentSearch = "";

let searchTimer = null;

/* -----------------------
   SEGÉDFÜGGVÉNYEK
----------------------- */

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function normalizeText(value) {
    return String(value ?? "")
        .trim()
        .toLocaleLowerCase("hu-HU");
}

function formatDate(value) {
    if (!value) {
        return "-";
    }

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString("hu-HU");
}

function isRemoved(book) {
    const room = normalizeText(book.room);

    return (
        room === normalizeText("Polcról levéve") ||
        room === normalizeText("Levéve")
    );
}

function isBorrowed(book) {
    return Boolean(book.borrower) ||
        normalizeText(book.room) === normalizeText("Kölcsönadva");
}

function getStatus(book) {
    if (isBorrowed(book)) {
        return {
            cardClass: "borrowed",
            textClass: "status-borrowed",
            text: book.borrower
                ? `📤 Kölcsönadva: ${book.borrower}`
                : "📤 Kölcsönadva"
        };
    }

    if (isRemoved(book)) {
        return {
            cardClass: "removed",
            textClass: "status-removed",
            text: "📦 Polcról levéve"
        };
    }

    return {
        cardClass: "",
        textClass: "status-normal",
        text: "📚 Polcon"
    };
}

function getLocation(book) {
    if (isBorrowed(book)) {
        return book.borrower
            ? `Kölcsönadva: ${book.borrower}`
            : "Kölcsönadva";
    }

    if (isRemoved(book)) {
        return "Polcról levéve";
    }

    const parts = [];

    if (book.room) {
        parts.push(book.room);
    }

    if (book.shelf && book.shelf !== "-") {
        parts.push(book.shelf);
    }

if (
    book.slot !== null &&
    book.slot !== undefined &&
    book.slot !== ""
) {
    parts.push(`${book.slot}. hely`);
}

    return parts.length
        ? parts.join(" / ")
        : "Nincs megadva";
}

/* -----------------------
   KÖNYVEK BETÖLTÉSE
----------------------- */

async function loadBooks(page = currentPage) {
    const list = document.getElementById("list");

    currentPage = Math.max(1, Number(page) || 1);

    const params = new URLSearchParams({
        page: String(currentPage),
        page_size: String(pageSize)
    });

    if (currentSearch.trim()) {
        params.set(
            "search",
            currentSearch.trim()
        );
    }

    list.innerHTML = `
        <div class="empty">
            Könyvek betöltése...
        </div>
    `;

    try {
        const response = await fetch(
            `/books/all?${params.toString()}`
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        if (
            !data ||
            !Array.isArray(data.books)
        ) {
            throw new Error(
                "A szerver hibás könyvlista-választ adott."
            );
        }

        allBooks = data.books;

        currentPage =
            Number(data.page) || 1;

        totalPages =
            Math.max(
                1,
                Number(data.total_pages) || 1
            );

        totalBooks =
            Math.max(
                0,
                Number(data.total) || 0
            );

        /*
         * Ha az utolsó oldal utolsó könyvét töröltük,
         * visszalépünk az új utolsó oldalra.
         */
        if (
            currentPage > totalPages &&
            totalPages >= 1
        ) {
            await loadBooks(totalPages);
            return;
        }

        render(allBooks);
        renderPagination();

    } catch (error) {
        console.error(
            "Betöltési hiba:",
            error
        );

        list.innerHTML = `
            <div class="error">
                Nem sikerült betölteni a könyveket:
                ${escapeHtml(error.message)}
            </div>
        `;

        totalBooks = 0;
        totalPages = 1;

        renderPagination();
    }
}

/* -----------------------
   LISTA KIRAJZOLÁSA
----------------------- */

function render(books) {
    const list = document.getElementById("list");
    const summary = document.getElementById("summary");

const firstRecord =
    totalBooks === 0
        ? 0
        : (currentPage - 1) * pageSize + 1;

const lastRecord =
    totalBooks === 0
        ? 0
        : firstRecord + books.length - 1;

if (currentSearch.trim()) {
    summary.textContent =
        `${totalBooks} találat – ` +
        `${firstRecord}–${lastRecord}. rekord`;
} else {
    summary.textContent =
        `${totalBooks} könyvpéldány – ` +
        `${firstRecord}–${lastRecord}. rekord`;
}

    list.innerHTML = "";

    if (!books.length) {
        list.innerHTML =
            '<div class="empty">Nincs a keresésnek megfelelő könyv.</div>';

        return;
    }

    books.forEach(book => {
        const status = getStatus(book);
        const bookId = Number(book.id);

        const card = document.createElement("div");

        card.className =
            `card ${status.cardClass}`.trim();

        card.innerHTML = `
            <div class="title-row">
                <div class="title">
                    ${escapeHtml(
                        book.title ||
                        book.isbn ||
                        "Névtelen könyv"
                    )}
                </div>

                <div class="author">
                    ${escapeHtml(book.author || "-")}
                </div>
            </div>

            <div class="grid">
                <div>
                    <span class="label">Egyedi index:</span>
                    ${escapeHtml(book.id ?? "-")}
                </div>

                <div>
                    <span class="label">ISBN:</span>
                    ${escapeHtml(book.isbn || "-")}
                </div>

                <div>
                    <span class="label">Kiadó:</span>
                    ${escapeHtml(book.publisher || "-")}
                </div>

                <div>
                    <span class="label">Kiadás éve:</span>
                    ${escapeHtml(book.year || "-")}
                </div>

                <div>
                    <span class="label">Felvéve:</span>
                    ${escapeHtml(formatDate(book.added))}
                </div>
            </div>

            <div class="location">
                <div>
                    <span class="label">Hely:</span>
                    ${escapeHtml(getLocation(book))}
                </div>

                <div class="${status.textClass}">
                    ${escapeHtml(status.text)}
                </div>
            </div>

            <div class="actions">
                <button
                    type="button"
                    class="edit"
                    onclick="editBook(${bookId})">
                    ✏️ Szerkesztés
                </button>

                <button
                    type="button"
                    class="del"
                    onclick="deleteBook(${bookId})">
                    🗑️ Törlés
                </button>
            </div>
        `;

        list.appendChild(card);
    });
}

function renderPagination() {
    const previousButton =
        document.getElementById(
            "previousPage"
        );

    const nextButton =
        document.getElementById(
            "nextPage"
        );

    const pageInfo =
        document.getElementById(
            "pageInfo"
        );

    previousButton.disabled =
        currentPage <= 1;

    nextButton.disabled =
        currentPage >= totalPages ||
        totalBooks === 0;

    pageInfo.textContent =
        `${currentPage} / ${totalPages}. oldal`;
}

/* -----------------------
   TÖRLÉS
----------------------- */

async function deleteBook(id) {
    if (!Number.isInteger(id) || id <= 0) {
        alert("Hibás könyvindex.");
        return;
    }

    if (!confirm(
        `Biztosan törlöd a(z) ${id}. indexű könyvpéldányt?`
    )) {
        return;
    }

    try {
        const response = await fetch(`/books/${id}`, {
            method: "DELETE"
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.message || `HTTP ${response.status}`
            );
        }

        if (data.status === "error") {
            throw new Error(
                data.message || "Ismeretlen törlési hiba."
            );
        }

        if (data.status === "not_found") {
            throw new Error(
                "A könyv már nem található az adatbázisban."
            );
        }

        await loadBooks();

    } catch (error) {
        console.error("Törlési hiba:", error);
        alert(`Törlési hiba: ${error.message}`);
    }
}

/* -----------------------
   SZERKESZTŐ TÁRHELYEK
----------------------- */

function flattenStorageTree(
    nodes,
    depth = 0,
    result = [],
    rootName = null,
    parentPath = []
) {
    for (const node of nodes) {
        const effectiveRootName =
            rootName || node.name;

        const currentPath = [
            ...parentPath,
            node.name
        ];

        result.push({
            ...node,
            depth,
            root_name: effectiveRootName,
            path_names: currentPath,
            path_label: currentPath
                .filter(
                    part =>
                        part
                        && part !== "-"
                )
                .join(" / ")
        });

        flattenStorageTree(
            node.children || [],
            depth + 1,
            result,
            effectiveRootName,
            currentPath
        );
    }

    return result;
}

async function loadEditorPlaces() {
    if (editorStorageLocations.length) {
        return;
    }

const response = await fetch(
    "/storage/tree"
    + "?household_id=1"
    + "&include_inactive=true"
);

    if (!response.ok) {
        throw new Error(
            `HTTP ${response.status}`
        );
    }

    const data = await response.json();

    if (
        !data
        || !Array.isArray(data.locations)
    ) {
        throw new Error(
            "A szerver hibás tárhelyfa-választ adott."
        );
    }

editorStorageLocations =
    flattenStorageTree(
        data.locations
    ).filter(
        location =>
            location.location_type === "slot"
    );

    editorStorageByPublicId = new Map(
        editorStorageLocations.map(
            location => [
                location.public_id,
                location
            ]
        )
    );

    const select =
        document.getElementById(
            "editLocation"
        );

    select.innerHTML = "";
filterEditorStorageOptions();
}

function filterEditorStorageOptions() {
    const query =
        normalizeText(
            document
                .getElementById(
                    "editLocationSearch"
                )
                .value
        );

    const select =
        document.getElementById(
            "editLocation"
        );

    const currentValue =
        select.value;

    select.innerHTML = "";

    const locationsByRoot = new Map();

    for (
        const location
        of editorStorageLocations
    ) {
        const searchableText =
            normalizeText(
                [
                    location.root_name,
                    location.path_label,
                    location.name,
                    location.slug
                ].join(" ")
            );

        if (
            query
            && !searchableText.includes(query)
        ) {
            continue;
        }

        const rootName =
            location.root_name || "Egyéb";

        if (!locationsByRoot.has(rootName)) {
            locationsByRoot.set(
                rootName,
                []
            );
        }

        locationsByRoot
            .get(rootName)
            .push(location);
    }

    for (
        const [
            rootName,
            locations
        ]
        of locationsByRoot
    ) {
        const group =
            document.createElement(
                "optgroup"
            );

        group.label = rootName;

        for (const location of locations) {
            const option =
                document.createElement(
                    "option"
                );

            option.value =
                location.public_id;

            const relativePath =
                location.path_names
                    .slice(1)
                    .filter(
                        part =>
                            part
                            && part !== "-"
                    )
                    .join(" / ");

            option.textContent =
                location.is_active
                    ? (
                        relativePath
                        || location.name
                    )
                    : (
                        `${relativePath || location.name}`
                        + " — inaktív"
                    );

            option.disabled =
                !location.is_active;

            group.appendChild(option);
        }

        select.appendChild(group);
    }

    if (
        currentValue
        && editorStorageByPublicId.has(
            currentValue
        )
    ) {
        select.value = currentValue;
    }

    syncEditorBorrower();
}

function syncEditorBorrower() {
const storagePublicId =
    document
        .getElementById("editLocation")
        .value;

const selected =
    editorStorageByPublicId.get(
        storagePublicId
    );

const borrowed =
    normalizeText(
        selected?.root_name
        || selected?.room
    ) === normalizeText("Kölcsönadva");

    document
        .getElementById("editBorrowBox")
        .style.display =
            borrowed ? "block" : "none";

    if (!borrowed) {
        document
            .getElementById("editBorrower")
            .value = "";
    }
}

document
    .getElementById("editLocation")
    .addEventListener(
        "change",
        syncEditorBorrower
    );

/* -----------------------
   SZERKESZTŐ MEGNYITÁSA
----------------------- */

async function editBook(id) {
    if (!Number.isInteger(id) || id <= 0) {
        alert("Hibás könyvindex.");
        return;
    }

    try {
        await loadEditorPlaces();

document
    .getElementById(
        "editLocationSearch"
    )
    .value = "";

filterEditorStorageOptions();

        const response =
            await fetch(`/books/${id}`);

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const book = await response.json();

        if (
            book.status === "error" ||
            book.status === "not_found"
        ) {
            throw new Error(
                book.message ||
                "A könyv nem található."
            );
        }

        if (!book.public_id) {
            throw new Error(
                "A könyvhöz nem tartozik modern "
                + "gyűjteményi azonosító."
            );
        }

        document.getElementById("editId").value =
            book.id;

        document
            .getElementById("editItemPublicId")
            .value =
                book.public_id || "";

        document.getElementById("editIndex").value =
            book.id;

        document.getElementById("editIsbn").value =
            book.isbn || "";

        document.getElementById("editTitle").value =
            book.title || "";

        document.getElementById("editAuthor").value =
            book.author || "";

        document.getElementById("editPublisher").value =
            book.publisher || "";

        document.getElementById("editYear").value =
            book.year || "";

        document.getElementById("editLocation").value =
    book.storage_public_id || "";

        if (
    !document
        .getElementById("editLocation")
        .value
) {
    throw new Error(
        "A könyv jelenlegi tárhelye "
        + "nem található az aktív tárhelyfában."
    );
}


        document.getElementById("editBorrower").value =
            book.borrower || "";

        document.getElementById("editStatus").textContent =
            "";

        syncEditorBorrower();

        document
            .getElementById("editModal")
            .style.display = "block";

    } catch (error) {
        console.error(
            "Szerkesztési hiba:",
            error
        );

        alert(
            `Szerkesztési hiba: ${error.message}`
        );
    }
}

/* -----------------------
   SZERKESZTŐ BEZÁRÁSA
----------------------- */

function closeEditor() {
    document
        .getElementById("editModal")
        .style.display = "none";
}

/* -----------------------
   SZERKESZTÉS MENTÉSE
----------------------- */

async function saveEditor() {
    const bookId = Number(
        document.getElementById("editId").value
    );

const storagePublicId =
    document
        .getElementById("editLocation")
        .value;

const selected =
    editorStorageByPublicId.get(
        storagePublicId
    );

const isBorrowed =
    normalizeText(selected?.root_name) ===
    normalizeText("Kölcsönadva");

    const editStatus =
        document.getElementById("editStatus");

    const isbn =
        document
            .getElementById("editIsbn")
            .value
            .replaceAll("-", "")
            .replaceAll(" ", "")
            .trim();

    const title =
        document
            .getElementById("editTitle")
            .value
            .trim();

    if (!isbn) {
        editStatus.textContent =
            "❌ Az ISBN nem lehet üres.";
        return;
    }

    if (!title) {
        editStatus.textContent =
            "❌ A cím nem lehet üres.";
        return;
    }

if (!storagePublicId) {
    editStatus.textContent =
        "❌ Válassz tárhelyet.";
    return;
}

    const borrower =
        document
            .getElementById("editBorrower")
            .value
            .trim();

    if (isBorrowed && !borrower) {
        editStatus.textContent =
            "❌ Add meg, kinél van a könyv.";
        return;
    }

    editStatus.textContent = "Mentés...";

    try {
        const response =
            await fetch(`/books/${bookId}`, {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    isbn: isbn,

                    title: title,

                    author:
                        document
                            .getElementById(
                                "editAuthor"
                            )
                            .value
                            .trim() || null,

                    publisher:
                        document
                            .getElementById(
                                "editPublisher"
                            )
                            .value
                            .trim() || null,

                    publish_year:
                        document
                            .getElementById(
                                "editYear"
                            )
                            .value
                            .trim() || null,

storage_public_id:
    storagePublicId,

                    borrower:
                        isBorrowed
                        ? borrower
                        : null
                })
            });

        const data = await response.json();

        if (
            !response.ok ||
            data.status === "error"
        ) {
            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );
        }

        if (data.status === "not_found") {
            throw new Error(
                "A könyv nem található."
            );
        }

        closeEditor();

        await loadBooks();

    } catch (error) {
        console.error("Mentési hiba:", error);

        editStatus.textContent =
            `❌ ${error.message}`;
    }
}

/* -----------------------
   MODAL HÁTTÉRRE KATTINTÁS
----------------------- */

document
    .getElementById("editModal")
    .addEventListener("click", event => {
        if (
            event.target.id === "editModal"
        ) {
            closeEditor();
        }
    });

/* -----------------------
   ESC BEZÁRÁS
----------------------- */

document.addEventListener(
    "keydown",
    event => {
        if (event.key === "Escape") {
            closeEditor();
        }
    }
);

document
    .getElementById(
        "editLocationSearch"
    )
    .addEventListener(
        "input",
        filterEditorStorageOptions
    );

document
    .getElementById("previousPage")
    .addEventListener("click", () => {
        if (currentPage > 1) {
            loadBooks(currentPage - 1);

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    });

document
    .getElementById("nextPage")
    .addEventListener("click", () => {
        if (currentPage < totalPages) {
            loadBooks(currentPage + 1);

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    });

/* -----------------------
   KERESÉS
----------------------- */

document
    .getElementById("search")
    .addEventListener("input", event => {
        clearTimeout(searchTimer);

        currentSearch =
            event.target.value.trim();

        searchTimer = setTimeout(() => {
            currentPage = 1;
            loadBooks(1);
        }, 350);
    });

loadBooks();
</script>
