<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>

<title>Tárhely-admin</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: #fff;
}

header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    gap: 14px;
    align-items: center;
    padding: 12px 16px;
    background: #1b1b1b;
    border-bottom: 1px solid #333;
}

header a {
    color: #6dff6d;
    text-decoration: none;
    font-weight: bold;
    white-space: nowrap;
}

header h1 {
    flex: 1;
    margin: 0;
    font-size: 22px;
}

main {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px;
}

.toolbar {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    padding: 14px;
    border: 1px solid #333;
    border-radius: 10px;
    background: #1d1d1d;
}

.toolbar label {
    display: flex;
    gap: 8px;
    align-items: center;
    color: #ddd;
}

.toolbar button {
    padding: 9px 14px;
    border: none;
    border-radius: 7px;
    background: #237c45;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.toolbar button:hover {
    background: #2d9b59;
}

#summary {
    margin-bottom: 12px;
    color: #aaa;
    font-size: 14px;
}

#tree {
    min-height: 100px;
}

.tree-list {
    margin: 0;
    padding-left: 22px;
    list-style: none;
    border-left: 1px solid #3a3a3a;
}

.tree-root {
    padding-left: 0;
    border-left: none;
}

.tree-item {
    margin: 8px 0;
}

.location-card {
    display: grid;
grid-template-columns:
    minmax(180px, 1fr)
    auto
    auto
    minmax(220px, auto);
    gap: 12px;
    align-items: center;
    padding: 11px 13px;
    border: 1px solid #343434;
    border-left: 4px solid #58d658;
    border-radius: 8px;
    background: #202020;
}

.location-card.inactive {
    opacity: 0.62;
    border-left-color: #d0a000;
}

.location-main {
    min-width: 0;
}

.location-name {
    color: #6dff6d;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.location-title-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.branch-toggle {
    width: 28px;
    height: 28px;
    padding: 0;
    border: none;
    border-radius: 5px;
    background: #303030;
    color: #ddd;
    font-size: 16px;
    cursor: pointer;
}

.branch-toggle:hover {
    background: #444;
}

.branch-toggle-placeholder {
    width: 28px;
    flex: 0 0 28px;
}

.child-count {
    margin-left: 4px;
    color: #888;
    font-size: 12px;
    font-weight: normal;
}

.location-meta {
    margin-top: 4px;
    color: #999;
    font-size: 12px;
    overflow-wrap: anywhere;
}

.location-type,
.location-state {
    padding: 4px 8px;
    border-radius: 999px;
    white-space: nowrap;
    font-size: 12px;
}

.location-type {
    background: #303030;
    color: #ddd;
}

.location-state {
    background: #164f2d;
    color: #9cffb9;
}

.location-actions {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.location-actions button {
    padding: 6px 9px;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 12px;
    cursor: pointer;
}

.location-actions .add-child {
    background: #237c45;
}

.location-actions .add-child:hover {
    background: #2d9b59;
}

.location-actions .edit-location {
    background: #2563a8;
}

.location-actions .edit-location:hover {
    background: #347dcc;
}

.location-actions .delete-location {
    background: #a80000;
}

.location-actions .delete-location:hover {
    background: #d00000;
}

.location-card.inactive .location-state {
    background: #594600;
    color: #ffe27a;
}

.toolbar-actions {
    display: flex;
    gap: 10px;
}

.toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 200;
    max-width: min(420px, calc(100vw - 40px));
    padding: 12px 16px;
    border-radius: 8px;
    background: #176b39;
    color: #d7ffe4;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transform: translateY(16px);
    pointer-events: none;
    transition:
        opacity 0.2s ease,
        transform 0.2s ease;
}

.toast.visible {
    opacity: 1;
    transform: translateY(0);
}

.toast.error {
    background: #8d1c1c;
    color: #ffe1e1;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.82);
}

.modal-content {
    width: 100%;
    max-width: 620px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 12px;
    background: #202020;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
}

.modal-header {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
}

.modal-header h2 {
    margin: 0 0 14px;
}

.modal-close {
    width: auto;
    padding: 2px 11px;
    border: none;
    background: transparent;
    color: white;
    font-size: 30px;
    cursor: pointer;
}

.modal-content label {
    display: block;
    margin-top: 13px;
    margin-bottom: 5px;
    color: #bbb;
}

.modal-content input,
.modal-content select,
.modal-content textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #555;
    border-radius: 7px;
    background: #303030;
    color: white;
    font-family: inherit;
    font-size: 16px;
}

.modal-content textarea {
    resize: vertical;
}

.parent-info {
    padding: 10px;
    border-radius: 7px;
    background: #292929;
    color: #bbb;
}

.checkbox-row {
    display: flex !important;
    gap: 8px;
    align-items: center;
}

.checkbox-row input {
    width: auto;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-actions button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.modal-actions .cancel {
    background: #666;
}

.modal-actions .save {
    background: #237c45;
}

.modal-actions .save:hover {
    background: #2d9b59;
}

.modal-actions button:disabled {
    background: #444;
    color: #999;
    cursor: default;
}

#locationFormStatus {
    min-height: 24px;
    margin-top: 14px;
    color: #ff7777;
}

.empty,
.error,
.loading {
    padding: 28px;
    border: 1px solid #333;
    border-radius: 10px;
    text-align: center;
    background: #1c1c1c;
}

.error {
    color: #ff7777;
}

@media (max-width: 700px) {
    header {
        align-items: flex-start;
        flex-direction: column;
    }

    .toast {
        right: 10px;
        bottom: 10px;
        max-width: calc(100vw - 20px);
    }

    .toolbar-actions,
    .modal-actions {
        flex-direction: column;
    }

    .modal {
        padding: 8px;
    }

    .modal-content {
        margin: 8px auto;
        padding: 15px;
    }

    .toolbar {
        align-items: stretch;
        flex-direction: column;
    }

    .location-actions {
        justify-content: flex-start;
    }

    .location-card {
        grid-template-columns: 1fr;
        gap: 8px;
    }

    .location-type,
    .location-state {
        width: fit-content;
    }
}
</style>
</head>

<body>

<header>
    <a href="/ui/index.html">⬅ Főoldal</a>
    <h1>Tárhely-admin</h1>
</header>

<main>
<div class="toolbar">
    <label>
        <input
            id="includeInactive"
            type="checkbox"
        >
        Inaktív tárhelyek mutatása
    </label>

    <div class="toolbar-actions">
        <button
            id="createRootButton"
            type="button"
        >
            ＋ Új gyökérelem
        </button>

        <button
            id="reloadButton"
            type="button"
        >
            Újratöltés
        </button>
    </div>
</div>

    <div id="summary"></div>

    <div id="tree">
        <div class="loading">
            Tárhelyek betöltése...
        </div>
    </div>
</main>

<div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
></div>

<div id="locationModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="locationModalTitle">
                Új tárhely
            </h2>

            <button
                id="locationModalClose"
                type="button"
                class="modal-close"
                aria-label="Bezárás"
            >
                ×
            </button>
        </div>

        <input
            id="locationParentPublicId"
            type="hidden"
        >

<input
    id="locationEditPublicId"
    type="hidden"
>

        <div id="locationParentInfo" class="parent-info">
            Gyökérelem létrehozása
        </div>

        <label for="locationName">
            Név
        </label>
        <input
            id="locationName"
            type="text"
            maxlength="150"
            autocomplete="off"
        >

        <label for="locationType">
            Típus
        </label>
        <select id="locationType">
            <option value="room">Helyiség</option>
            <option value="area">Terület</option>
            <option value="shelf">Polc</option>
            <option value="cabinet">Szekrény</option>
            <option value="drawer">Fiók</option>
            <option value="box">Doboz</option>
            <option value="slot">Tárhely</option>
            <option value="other">Egyéb</option>
        </select>

        <label for="locationSlug">
            Slug
        </label>
        <input
            id="locationSlug"
            type="text"
            maxlength="150"
            placeholder="Üresen automatikusan készül"
            autocomplete="off"
        >

        <label for="locationDescription">
            Leírás
        </label>
        <textarea
            id="locationDescription"
            maxlength="500"
            rows="4"
        ></textarea>

        <label for="locationSortOrder">
            Sorrend
        </label>
        <input
            id="locationSortOrder"
            type="number"
            min="0"
            step="1"
            value="0"
        >

        <label class="checkbox-row">
            <input
                id="locationIsActive"
                type="checkbox"
                checked
            >
            Aktív
        </label>

        <div id="locationFormStatus"></div>

        <div class="modal-actions">
            <button
                id="locationCancelButton"
                type="button"
                class="cancel"
            >
                Mégse
            </button>

            <button
                id="locationSaveButton"
                type="button"
                class="save"
            >
                Létrehozás
            </button>
        </div>
    </div>
</div>

<script>
"use strict";

const householdId = 1;

const storageLocationsByPublicId = new Map();

let slugEditedManually = false;

let toastTimer = null;


function showToast(
    message,
    type = "success"
) {
    const toast =
        document.getElementById("toast");

    clearTimeout(toastTimer);

    toast.textContent = message;

    toast.classList.toggle(
        "error",
        type === "error"
    );

    toast.classList.add("visible");

    toastTimer = setTimeout(() => {
        toast.classList.remove("visible");
    }, 3200);
}

const collapsedStorageKey =
    "familycollection.storage.collapsed";

const collapsedStorageIds = new Set(
    JSON.parse(
        localStorage.getItem(
            collapsedStorageKey
        ) || "[]"
    )
);

function resetLocationForm() {
document
    .getElementById("locationEditPublicId")
    .value = "";    

document
        .getElementById("locationParentPublicId")
        .value = "";

    document
        .getElementById("locationParentInfo")
        .textContent = "Gyökérelem létrehozása";

    document
        .getElementById("locationName")
        .value = "";

    document
        .getElementById("locationType")
        .value = "room";

    document
        .getElementById("locationSlug")
        .value = "";

    document
        .getElementById("locationDescription")
        .value = "";

    document
        .getElementById("locationSortOrder")
        .value = "0";

    document
        .getElementById("locationIsActive")
        .checked = true;

    document
        .getElementById("locationFormStatus")
        .textContent = "";

    document
        .getElementById("locationModalTitle")
        .textContent = "Új gyökérelem";

    document
        .getElementById("locationSaveButton")
        .textContent = "Létrehozás";
slugEditedManually = false;
}


function openCreateRootModal() {
    resetLocationForm();

    document
        .getElementById("locationModal")
        .style.display = "block";

    document
        .getElementById("locationName")
        .focus();
}

function openCreateChildModal(
    parentPublicId,
    parentName
) {
    resetLocationForm();

    document
        .getElementById(
            "locationParentPublicId"
        )
        .value = parentPublicId;

    document
        .getElementById(
            "locationParentInfo"
        )
        .textContent =
            `Szülő: ${parentName}`;

    document
        .getElementById(
            "locationModalTitle"
        )
        .textContent =
            `Új gyermek: ${parentName}`;

    document
        .getElementById(
            "locationType"
        )
        .value = "shelf";

    document
        .getElementById(
            "locationModal"
        )
        .style.display = "block";

    document
        .getElementById(
            "locationName"
        )
        .focus();
}

function openEditLocation(publicId) {
    const location =
        storageLocationsByPublicId.get(
            publicId
        );

    if (!location) {
        alert(
            "A szerkesztendő tárhely "
            + "nem található a betöltött fában."
        );

        return;
    }

    resetLocationForm();

    document
        .getElementById(
            "locationEditPublicId"
        )
        .value = location.public_id;

    document
        .getElementById(
            "locationParentPublicId"
        )
        .value =
            location.parent_public_id || "";

    document
        .getElementById(
            "locationParentInfo"
        )
        .textContent =
            location.parent_public_id
                ? "A szülőkapcsolat ebben "
                    + "a verzióban nem módosítható."
                : "Gyökérelem";

    document
        .getElementById(
            "locationName"
        )
        .value = location.name || "";

    document
        .getElementById(
            "locationType"
        )
        .value =
            location.location_type || "other";

    document
        .getElementById(
            "locationSlug"
        )
        .value = location.slug || "";

slugEditedManually = true;

    document
        .getElementById(
            "locationDescription"
        )
        .value =
            location.description || "";

    document
        .getElementById(
            "locationSortOrder"
        )
        .value = String(
            location.sort_order ?? 0
        );

    document
        .getElementById(
            "locationIsActive"
        )
        .checked =
            Boolean(location.is_active);

    document
        .getElementById(
            "locationModalTitle"
        )
        .textContent =
            `Tárhely szerkesztése: ${location.name}`;

    document
        .getElementById(
            "locationSaveButton"
        )
        .textContent = "Mentés";

    document
        .getElementById(
            "locationModal"
        )
        .style.display = "block";

    document
        .getElementById(
            "locationName"
        )
        .focus();
}

function closeLocationModal() {
    document
        .getElementById("locationModal")
        .style.display = "none";
}

async function createLocation() {
const editPublicId =
    document
        .getElementById(
            "locationEditPublicId"
        )
        .value
        .trim();    

const statusBox =
        document.getElementById(
            "locationFormStatus"
        );

    const saveButton =
        document.getElementById(
            "locationSaveButton"
        );

    const parentPublicId =
        document
            .getElementById(
                "locationParentPublicId"
            )
            .value
            .trim();

    const name =
        document
            .getElementById(
                "locationName"
            )
            .value
            .trim();

    const locationType =
        document
            .getElementById(
                "locationType"
            )
            .value;

    const slug =
        document
            .getElementById(
                "locationSlug"
            )
            .value
            .trim();

    const description =
        document
            .getElementById(
                "locationDescription"
            )
            .value
            .trim();

    const sortOrder = Number(
        document
            .getElementById(
                "locationSortOrder"
            )
            .value
    );

    const isActive =
        document
            .getElementById(
                "locationIsActive"
            )
            .checked;

    if (!name) {
        statusBox.textContent =
            "❌ A név nem lehet üres.";

        document
            .getElementById("locationName")
            .focus();

        return;
    }

    if (
        !Number.isInteger(sortOrder)
        || sortOrder < 0
    ) {
        statusBox.textContent =
            "❌ A sorrend nem lehet negatív.";

        return;
    }


statusBox.textContent =
    editPublicId
        ? "Mentés..."
        : "Létrehozás...";

    saveButton.disabled = true;

    try {
const url =
    editPublicId
        ? `/storage/${editPublicId}`
        : "/storage";

const method =
    editPublicId
        ? "PATCH"
        : "POST";

const response = await fetch(
    url,
            {
method: method,               

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    household_id:
                        householdId,

                    parent_public_id:
                        parentPublicId
                        || null,

                    name: name,

                    slug:
                        slug || null,

                    location_type:
                        locationType,

                    description:
                        description || null,

                    sort_order:
                        sortOrder,

                    is_active:
                        isActive
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail
                || `HTTP ${response.status}`
            );
        }

if (parentPublicId) {
    collapsedStorageIds.delete(
        parentPublicId
    );

    saveCollapsedStorageIds();
}

const successMessage =
    editPublicId
        ? "Tárhely sikeresen módosítva."
        : "Tárhely sikeresen létrehozva.";

closeLocationModal();

await loadStorageTree();

showToast(successMessage);


    } catch (error) {
        console.error(
            "Tárhely-létrehozási hiba:",
            error
        );

        statusBox.textContent =
            `❌ ${error.message}`;

    } finally {
        saveButton.disabled = false;
    }
}

async function deleteLocation(
    publicId,
    name
) {
    const confirmed = confirm(
        `"${name}" tárhely törlése?\n\n`
        + "Csak akkor törölhető, ha nincs "
        + "gyermeke és még soha nem volt "
        + "hozzá rendelve gyűjteményi elem."
    );

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(
            `/storage/${publicId}`,
            {
                method: "DELETE"
            }
        );

        if (!response.ok) {
            const data = await response.json();

            throw new Error(
                data.detail
                || `HTTP ${response.status}`
            );
        }

        await loadStorageTree();

showToast(
    `"${name}" tárhely törölve.`
);

    } catch (error) {
        console.error(
            "Tárhelytörlési hiba:",
            error
        );

showToast(
    `Nem sikerült törölni: ${error.message}`,
    "error"
);

    }
}

function generateSlug(text) {
    return String(text ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .replace(/-+/g, "-");
}

function escapeHtml(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function locationTypeLabel(type) {
    const labels = {
        room: "Helyiség",
        shelf: "Polc",
        cabinet: "Szekrény",
        drawer: "Fiók",
        box: "Doboz",
        slot: "Tárhely",
        area: "Terület",
        other: "Egyéb"
    };

    return labels[type] || type || "Ismeretlen";
}
function countNodes(nodes) {
    return nodes.reduce(
        (total, node) =>
            total
            + 1
            + countNodes(node.children || []),
        0
    );
}

function saveCollapsedStorageIds() {
    localStorage.setItem(
        collapsedStorageKey,
        JSON.stringify(
            Array.from(collapsedStorageIds)
        )
    );
}


function isStorageCollapsed(publicId) {
    return collapsedStorageIds.has(
        publicId
    );
}


function toggleStorageBranch(publicId) {
    if (
        collapsedStorageIds.has(
            publicId
        )
    ) {
        collapsedStorageIds.delete(
            publicId
        );
    } else {
        collapsedStorageIds.add(
            publicId
        );
    }

    saveCollapsedStorageIds();

    const locations = Array.from(
        storageLocationsByPublicId.values()
    );

    const roots = locations.filter(
        location =>
            !location.parent_public_id
    );

    renderTree(roots);
}

function indexStorageLocations(nodes) {
    storageLocationsByPublicId.clear();

    function walk(node) {
        storageLocationsByPublicId.set(
            node.public_id,
            node
        );

        for (
            const child
            of node.children || []
        ) {
            walk(child);
        }
    }

    for (const node of nodes) {
        walk(node);
    }
}

function renderNode(node) {
    const children = Array.isArray(node.children)
        ? node.children
        : [];

    return `
        <li class="tree-item">
            <div class="location-card ${
                node.is_active ? "" : "inactive"
            }">

<div class="location-main">
    <div class="location-title-row">
        ${
            children.length
                ? `
                    <button
                        type="button"
                        class="branch-toggle"
                        data-action="toggle"
                        data-public-id="${escapeHtml(
                            node.public_id
                        )}"
                        aria-label="Ág nyitása vagy zárása"
                    >
                        ${
                            isStorageCollapsed(
                                node.public_id
                            )
                                ? "▶"
                                : "▼"
                        }
                    </button>
                `
                : `
                    <span
                        class="branch-toggle-placeholder"
                    ></span>
                `
        }

        <div class="location-name">
            ${escapeHtml(node.name)}

            ${
                children.length
                    ? `
                        <span class="child-count">
                            (${children.length})
                        </span>
                    `
                    : ""
            }
        </div>
    </div>

                    <div class="location-meta">
                        slug:
                        ${escapeHtml(node.slug)}
                        · public_id:
                        ${escapeHtml(node.public_id)}
                    </div>

                    ${
                        node.description
                            ? `
                                <div class="location-meta">
                                    ${escapeHtml(
                                        node.description
                                    )}
                                </div>
                            `
                            : ""
                    }
                </div>

                <div class="location-type">
                    ${escapeHtml(
                        locationTypeLabel(
                            node.location_type
                        )
                    )}
                </div>

                <div class="location-state">
                    ${
                        node.is_active
                            ? "Aktív"
                            : "Inaktív"
                    }
                </div>

                <div class="location-actions">
                    <button
                        type="button"
                        class="add-child"
                        data-action="add-child"
                        data-public-id="${escapeHtml(
                            node.public_id
                        )}"
                    >
                        ＋ Gyermek
                    </button>

                    <button
                        type="button"
                        class="edit-location"
                        data-action="edit"
                        data-public-id="${escapeHtml(
                            node.public_id
                        )}"
                    >
                        ✏️ Szerkesztés
                    </button>

                    <button
                        type="button"
                        class="delete-location"
                        data-action="delete"
                        data-public-id="${escapeHtml(
                            node.public_id
                        )}"
                    >
                        🗑️ Törlés
                    </button>
                </div>
            </div>

${
    children.length
    && !isStorageCollapsed(
        node.public_id
    )
        ? `
            <ul class="tree-list">
                ${children
                    .map(renderNode)
                    .join("")}
            </ul>
        `
        : ""
}

        </li>
    `;
}

function renderTree(locations) {
    const tree =
        document.getElementById("tree");

    if (!locations.length) {
        tree.innerHTML = `
            <div class="empty">
                Nincs megjeleníthető tárhely.
            </div>
        `;

        return;
    }

    tree.innerHTML = `
        <ul class="tree-list tree-root">
            ${locations
                .map(renderNode)
                .join("")}
        </ul>
    `;
}

async function loadStorageTree() {
    const tree =
        document.getElementById("tree");

    const summary =
        document.getElementById("summary");

    const includeInactive =
        document
            .getElementById("includeInactive")
            .checked;

    tree.innerHTML = `
        <div class="loading">
            Tárhelyek betöltése...
        </div>
    `;

    summary.textContent = "";

    const params = new URLSearchParams({
        household_id: String(householdId),
        include_inactive: String(includeInactive)
    });

    try {
        const response = await fetch(
            `/storage/tree?${params.toString()}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail ||
                `HTTP ${response.status}`
            );
        }

        if (
            !data ||
            !Array.isArray(data.locations)
        ) {
            throw new Error(
                "A szerver hibás tárhelyfa-választ adott."
            );
        }

indexStorageLocations(
    data.locations
);

        const nodeCount = countNodes(
            data.locations
        );

        summary.textContent =
            `${nodeCount} tárhelyelem · `
            + `${data.locations.length} gyökérelem`;

        renderTree(data.locations);

    } catch (error) {
        console.error(
            "Tárhelybetöltési hiba:",
            error
        );

        tree.innerHTML = `
            <div class="error">
                Nem sikerült betölteni a tárhelyeket:
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}

document
    .getElementById("reloadButton")
    .addEventListener(
        "click",
        loadStorageTree
    );

document
    .getElementById("includeInactive")
    .addEventListener(
        "change",
        loadStorageTree
    );

document
    .getElementById("createRootButton")
    .addEventListener(
        "click",
        openCreateRootModal
    );

document
    .getElementById("locationModalClose")
    .addEventListener(
        "click",
        closeLocationModal
    );

document
    .getElementById("locationCancelButton")
    .addEventListener(
        "click",
        closeLocationModal
    );

document
    .getElementById("locationSaveButton")
    .addEventListener(
        "click",
        createLocation
    );

document
    .getElementById("locationModal")
    .addEventListener(
        "keydown",
        event => {
            if (
                event.key === "Enter"
                && event.target.tagName
                !== "TEXTAREA"
            ) {
                event.preventDefault();
                createLocation();
            }
        }
    );

document
    .getElementById("locationModal")
    .addEventListener(
        "click",
        event => {
            if (
                event.target.id ===
                "locationModal"
            ) {
                closeLocationModal();
            }
        }
    );

document.addEventListener(
    "keydown",
    event => {
        if (event.key === "Escape") {
            closeLocationModal();
        }
    }
);

document
    .getElementById("tree")
    .addEventListener(
        "click",
        event => {
            const button =
                event.target.closest(
                    "button[data-action]"
                );

            if (!button) {
                return;
            }

            const action =
                button.dataset.action;

            const publicId =
                button.dataset.publicId || "";

const card =
    button.closest(".location-card");

const name =
    card
        ?.querySelector(
            ".location-name"
        )
        ?.textContent
        ?.trim()
    || "";

if (action === "toggle") {
    toggleStorageBranch(
        publicId
    );

    return;
}

if (action === "add-child") {
    openCreateChildModal(
        publicId,
        name
    );

    return;
}

if (action === "edit") {
    openEditLocation(
        publicId
    );

    return;
}

if (action === "delete") {
    deleteLocation(
        publicId,
        name
    );

    return;
}

        }
    );

document
    .getElementById("locationName")
    .addEventListener(
        "input",
        () => {

            if (slugEditedManually) {
                return;
            }

            document
                .getElementById("locationSlug")
                .value =
                    generateSlug(
                        document
                            .getElementById("locationName")
                            .value
                    );
        }
    );

document
    .getElementById("locationSlug")
    .addEventListener(
        "input",
        event => {

            slugEditedManually =
                event.target.value.trim() !== "";

        }
    );

loadStorageTree();
</script>

</body>
</html>
