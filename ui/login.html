<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FamilyCollection – Belépés</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-card {
            width: min(92vw, 420px);
            padding: 24px;
            border-radius: 14px;
            background: #202020;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            color: #6dff6d;
        }

        .subtitle {
            margin-bottom: 22px;
            color: #aaa;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #111;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #6dff6d;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #2e8b57;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .status {
            min-height: 24px;
            margin-top: 14px;
            color: #ff7b7b;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <h1>FamilyCollection</h1>

        <div class="subtitle">
            Jelentkezz be a gyűjtemények kezeléséhez.
        </div>

        <form id="loginForm">
            <label for="email">
                E-mail cím
            </label>

            <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                required
            >

            <label for="password">
                Jelszó
            </label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button
                id="loginButton"
                type="submit"
            >
                Belépés
            </button>
        </form>

        <div
            id="status"
            class="status"
        ></div>
    </main>

    <script>
        const loginForm =
            document.getElementById(
                "loginForm"
            );

        const email =
            document.getElementById(
                "email"
            );

        const password =
            document.getElementById(
                "password"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const statusBox =
            document.getElementById(
                "status"
            );


        async function redirectIfAuthenticated() {
            try {
                const response =
                    await fetch(
                        "/auth/context"
                    );

                if (response.ok) {
                    window.location.href =
                        "/ui/dashboard.html";
                }

            } catch {
                // Login oldalon nem hiba,
                // ha még nincs session.
            }
        }


        loginForm.addEventListener(
            "submit",
            async event => {
                event.preventDefault();

                statusBox.textContent = "";
                loginButton.disabled = true;

                try {
                    const response =
                        await fetch(
                            "/auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email:
                                        email.value.trim(),

                                    password:
                                        password.value
                                })
                            }
                        );

                    let data = null;

                    try {
                        data =
                            await response.json();
                    } catch {
                        data = null;
                    }

                    if (!response.ok) {
                        throw new Error(
                            data?.detail
                            || `HTTP ${response.status}`
                        );
                    }

                    window.location.href =
                        "/ui/dashboard.html";

                } catch (error) {
                    statusBox.textContent =
                        `❌ ${error.message}`;

                } finally {
                    loginButton.disabled = false;
                }
            }
        );


        redirectIfAuthenticated();

        email.focus();
    </script>
</body>
</html>
