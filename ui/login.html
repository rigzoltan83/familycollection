<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

<title data-i18n="login.title">
    FamilyCollection – Login
</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #eee;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .login-card {
            width: min(92vw, 420px);
            padding: 24px;
            border-radius: 14px;
            background: #202020;
            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            color: #6dff6d;
        }

.language-switcher {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 14px;
}

.language-switcher select {
    padding: 6px 10px;
    border: 1px solid #555;
    border-radius: 6px;
    background: #111;
    color: #eee;
    font-size: 14px;
    cursor: pointer;
}

        .subtitle {
            margin-bottom: 22px;
            color: #aaa;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #111;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #6dff6d;
            outline-offset: 1px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #2e8b57;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .status {
            min-height: 24px;
            margin-top: 14px;
            color: #ff7b7b;
        }
    </style>
<script>
window.FC_BASE_PATH = (() => {
    const marker = "/ui/";
    const index = window.location.pathname.indexOf(marker);

    if (index <= 0) {
        return "";
    }

    return window.location.pathname.slice(0, index);
})();

window.fcUrl = (path) => {
    if (!path) {
        return window.FC_BASE_PATH || "/";
    }

    if (!path.startsWith("/")) {
        path = "/" + path;
    }

    return window.FC_BASE_PATH + path;
};
</script>

</head>

<body>
<main class="login-card">
    <div class="language-switcher">
        <select id="languageSelect">
            <option
                value="en"
                data-i18n="language.english"
            >
                English
            </option>

            <option
                value="hu"
                data-i18n="language.hungarian"
            >
                Magyar
            </option>
        </select>
    </div>

    <h1>FamilyCollection</h1>

<div
    class="subtitle"
    data-i18n="login.subtitle"
>
    Sign in to manage your collections.
</div>

        <form id="loginForm">

<label
    for="identifier"
    data-i18n="login.username"
>
    Email address or username
</label>

<input
    id="identifier"
    name="identifier"
    type="text"
    autocomplete="username"
    data-i18n-placeholder="login.identifier_placeholder"
    placeholder="e.g. admin or name@example.com"
    required
>

<label
    for="password"
    data-i18n="login.password"
>
    Password
</label>

            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

<button
    id="loginButton"
    type="submit"
    data-i18n="login.submit"
>
    Sign in
</button>

        </form>

        <div
            id="status"
            class="status"
        ></div>
    </main>

    <script>
        const loginForm =
            document.getElementById(
                "loginForm"
            );

const identifier =
    document.getElementById(
        "identifier"
    );

        const password =
            document.getElementById(
                "password"
            );

        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const statusBox =
            document.getElementById(
                "status"
            );


        async function redirectIfAuthenticated() {
            try {
                const response =
                    await fetch(fcUrl("/auth/context")
                    );

                if (response.ok) {
                    window.location.href =
                        fcUrl("/ui/dashboard.html");
                }

            } catch {
                // Login oldalon nem hiba,
                // ha még nincs session.
            }
        }


        loginForm.addEventListener(
            "submit",
            async event => {
                event.preventDefault();

                statusBox.textContent = "";
                loginButton.disabled = true;

                try {
                    const response =
                        await fetch(fcUrl("/auth/login"),
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

body: JSON.stringify({
    identifier:
        identifier.value.trim(),

    password:
        password.value
})

                            }
                        );

                    let data = null;

                    try {
                        data =
                            await response.json();
                    } catch {
                        data = null;
                    }

if (!response.ok) {
    if (response.status === 401) {
        throw new Error(
            FamilyCollectionI18n.t(
                "login.error.invalid_credentials"
            )
        );
    }

    throw new Error(
        FamilyCollectionI18n.t(
            "login.error.http",
            {
                status: response.status
            }
        )
    );
}

                    window.location.href =
                        fcUrl("/ui/dashboard.html");

                } catch (error) {
                    statusBox.textContent =
                        `❌ ${error.message}`;

                } finally {
                    loginButton.disabled = false;
                }
            }
        );


        redirectIfAuthenticated();

identifier.focus();
    </script>
<script src="./js/i18n.js"></script>

<script>
    document.addEventListener(
        "DOMContentLoaded",
        () => {
            const languageSelect =
                document.getElementById(
                    "languageSelect"
                );

            if (!languageSelect) {
                return;
            }

            languageSelect.value =
                FamilyCollectionI18n
                    .getLanguage();

            languageSelect.addEventListener(
                "change",
                event => {
                    FamilyCollectionI18n
                        .setLanguage(
                            event.target.value
                        );
                }
            );
        }
    );
</script>
</body>
</html>
